<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Availability Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c2b2a; --ink-soft: #5b6a68; --ink-faint: #8B978F;
    --line: #dcdcd6; --line-soft: #ebeae5; --accent: #2f6e62; --accent-soft: #e4efeb; --accent-ink: #1D453A;
    --st-available: #2F6F5E; --st-available-bg: #E4EFEB;
    --st-unconfirmed: #B4790E; --st-unconfirmed-bg: #F6ECD9;
    --st-arrived: #2A5C9A; --st-arrived-bg: #E2EBF5;
    --st-confirmed: #4B4A9E; --st-confirmed-bg: #E7E6F4;
    --st-unavailable: #A23B32; --st-unavailable-bg: #F4E1DE;
    --amber: #a6702c; --amber-soft: #f4e9d8;
    --radius: 10px;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191a; --panel: #1d2322; --ink: #e9ede9; --ink-soft: #98a3a0; --ink-faint: #71827A;
      --line: #333c3a; --line-soft: #262e2c; --accent: #79c2ac; --accent-soft: #213230; --accent-ink: #9FDFC7;
      --st-available: #5FB79B; --st-available-bg: #1E3831;
      --st-unconfirmed: #E3AC55; --st-unconfirmed-bg: #3A2E17;
      --st-arrived: #7BA8DE; --st-arrived-bg: #1E2C3E;
      --st-confirmed: #A6A3E8; --st-confirmed-bg: #292752;
      --st-unavailable: #E28579; --st-unavailable-bg: #3B211E;
      --amber: #dcab6a; --amber-soft: #2f2a1e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191a; --panel: #1d2322; --ink: #e9ede9; --ink-soft: #98a3a0; --ink-faint: #71827A;
    --line: #333c3a; --line-soft: #262e2c; --accent: #79c2ac; --accent-soft: #213230; --accent-ink: #9FDFC7;
    --st-available: #5FB79B; --st-available-bg: #1E3831;
    --st-unconfirmed: #E3AC55; --st-unconfirmed-bg: #3A2E17;
    --st-arrived: #7BA8DE; --st-arrived-bg: #1E2C3E;
    --st-confirmed: #A6A3E8; --st-confirmed-bg: #292752;
    --st-unavailable: #E28579; --st-unavailable-bg: #3B211E;
    --amber: #dcab6a; --amber-soft: #2f2a1e;
  }
  * { box-sizing: border-box; }

  /* Number inputs: hide the browser's default spin-button control (the
     up/down arrows some people see as a mini scrollbar) everywhere in the
     app, rather than per-field - there are ~20 number inputs across Setup
     alone. Scroll-to-change is blocked separately in JS (see the global
     wheel listener), since hiding the arrows alone doesn't stop a page
     scroll over a focused number field from silently changing its value. */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #app { min-height: 100%; }
  .shell { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 26px; }
  .topbar h1 { font-family: var(--serif); font-weight: 600; font-size: 26px; letter-spacing: -0.01em; margin: 0 0 6px; }
  .conn-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .conn-pip { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
  .conn-pip.on { background: var(--st-available); }
  .conn-pip.off { background: var(--st-unavailable); }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  button { font-family: var(--sans); font-size: 13.5px; cursor: pointer; border-radius: 8px; border: 1px solid transparent; }
  .btn-primary { background: var(--accent); color: #F4FBF8; padding: 9px 16px; font-weight: 600; border: none; transition: opacity .15s; }
  .btn-primary:hover { opacity: .88; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-primary .spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(244,251,248,.35); border-top-color: #F4FBF8; margin-right: 7px; vertical-align: -2px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); color: var(--ink-soft); border-radius: 8px; }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .icon-btn svg { width: 17px; height: 17px; }

  .filter-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; }
  .filter-actions { display: flex; align-items: center; gap: 24px; flex-shrink: 0; }
  .filter-actions .btn-primary { height: 41px; }
  .filter-fields { display: flex; gap: 14px; flex-wrap: wrap; }
  .filter-field label { display: block; font-size: 11.5px; color: var(--ink-faint); margin-bottom: 6px; }
  .filter-field input[type="date"], .filter-field select { font-family: var(--sans); font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; min-width: 150px; }
  .filter-field input[type="date"]:focus, .filter-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filter-stat { text-align: right; }
  .filter-stat .label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .filter-stat .num { font-family: var(--mono); font-weight: 500; font-size: 30px; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; }

  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .agent-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .agent-grid { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--ink-faint); padding: 12px 14px; border-bottom: 1px solid var(--line); }
  thead th.num-col, td.num-col { text-align: center; width: 220px; }
  tbody td { padding: 13px 14px; border-bottom: 1px solid var(--line-soft); font-size: 14px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  .rtype-name { font-weight: 500; }
  .count-pill { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .count-pill.zero { opacity: .55; }
  tfoot td { padding: 13px 14px; font-weight: 600; font-size: 13.5px; border-top: 1px solid var(--line); }
  tfoot .num-col { font-family: var(--mono); text-align: center; font-variant-numeric: tabular-nums; }

  .qty-cell { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .avail-pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill-avail { background: var(--st-available-bg); color: var(--st-available); }
  .pill-selling { background: var(--st-unconfirmed-bg); color: var(--st-unconfirmed); }
  .pill-last { background: var(--st-unavailable-bg); color: var(--st-unavailable); }
  .pill-none { background: var(--line-soft); color: var(--ink-faint); }
  .gender-split { font-size: 11.5px; color: var(--ink-faint); margin-top: 5px; }
  .gender-split .g-male { color: var(--st-arrived); font-weight: 500; }
  .gender-split .g-female { color: var(--st-confirmed); font-weight: 500; }
  .gender-split .g-full { color: var(--accent); font-weight: 500; }
  .gender-split .g-conflict { color: var(--st-unconfirmed); font-weight: 500; }

  .empty-state { padding: 64px 24px; text-align: center; }
  .empty-state h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 8px; }
  .empty-state p { color: var(--ink-soft); font-size: 14px; max-width: 380px; margin: 0 auto 20px; line-height: 1.5; }

  .meta-line { font-size: 12px; color: var(--ink-faint); margin-top: 14px; }
  .unmapped-note { font-size: 12px; color: var(--st-unconfirmed); margin-top: 10px; line-height: 1.5; }

  .view-tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .view-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 4px; margin-right: 18px; font-weight: 500; font-size: 14px; color: var(--ink-faint); border-radius: 0; }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .view-tab:hover:not(.active) { color: var(--ink-soft); }

  .stat-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; text-align: left; font-family: var(--sans); transition: border-color .15s ease, background .15s ease; }
  .stat-card:hover { border-color: var(--ink-faint); }
  .stat-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .stat-label { font-size: 11px; color: var(--ink-faint); margin-bottom: 6px; }
  .stat-num { font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); }

  .res-filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .res-search { flex: 1 1 220px; min-width: 160px; font-family: var(--sans); font-size: 13.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); outline: none; }
  .res-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .res-select { font-family: var(--sans); font-size: 13px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); outline: none; }
  .res-date { font-family: var(--sans); font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); outline: none; }

  .res-table th.sortable { cursor: pointer; user-select: none; }
  .res-table th.sortable:hover { color: var(--ink-soft); }
  .res-table th.expand-col, .res-table td.expand-col { width: 34px; padding-left: 10px; padding-right: 0; }
  .res-table .res-row { cursor: pointer; }
  .res-table .res-row:hover { background: var(--line-soft); }
  .expand-btn { background: none; border: none; color: var(--ink-faint); width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 5px; transition: transform .15s ease; pointer-events: none; }
  .expand-btn svg { width: 13px; height: 13px; transition: transform .15s ease; }
  .expand-btn.open svg { transform: rotate(90deg); }

  .status-pill { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .status-confirmed { background: var(--st-confirmed-bg); color: var(--st-confirmed); }
  .status-arrived { background: var(--st-arrived-bg); color: var(--st-arrived); }
  .status-unconfirmed { background: var(--st-unconfirmed-bg); color: var(--st-unconfirmed); }
  .status-available { background: var(--st-available-bg); color: var(--st-available); }
  .status-unavailable { background: var(--st-unavailable-bg); color: var(--st-unavailable); }

  .res-detail-row td { background: var(--bg); border-bottom: 1px solid var(--line-soft); padding: 12px 14px 16px; }
  .res-detail { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px 16px; }
  .fp-room-detail { grid-template-columns: repeat(4, 1fr); padding: 10px 14px 14px; }
  .detail-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .detail-label { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
  .detail-value { font-size: 13px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .console-back { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 100px; padding: 8px 16px; margin-bottom: 22px; }
  .console-back:hover { background: var(--accent-soft); }
  .console-back svg { width: 14px; height: 14px; }
  .console-head h1 { font-family: var(--serif); font-size: clamp(22px, 3vw, 28px); font-weight: 600; margin: 0 0 4px; }
  .console-head p { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 22px; max-width: 480px; line-height: 1.5; }

  .setup-tabbar { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .setup-tab { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-soft); background: none; border: none; border-radius: 0; padding: 8px 4px; margin-right: 16px; cursor: pointer; border-bottom: 2px solid transparent; }
  .setup-tab:hover { color: var(--ink); }
  .setup-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .console-body { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px 28px; }
  .console-section-label { font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); font-weight: 600; margin: 0 0 12px; }
  .console-section-label.spaced { margin-top: 26px; }

  .env-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .env-row:last-child { border-bottom: none; }
  .env-row .k { color: var(--ink-soft); }
  .env-row .v { font-family: var(--mono); font-size: 12.5px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .field .hint { font-size: 12px; color: var(--ink-faint); margin-top: 5px; line-height: 1.4; }
  .field input { width: 100%; font-family: var(--sans); font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
  .login-title { font-size: 18px; font-weight: 700; margin: 0 0 20px; text-align: center; color: var(--ink); }
  .login-toggle { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; margin-bottom: 20px; }
  .login-toggle-btn { flex: 1; padding: 7px 10px; border: none; background: none; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .login-toggle-btn.active { background: var(--accent); color: #fff; }
  .floor-range-row { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .rnc-table { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .rnc-row { display: flex; align-items: center; gap: 12px; }
  .rnc-label { flex: 0 0 170px; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rnc-cell { flex: 0 0 auto; width: 150px; }
  .rnc-cell select { width: 100%; }
  .rnc-header .rnc-cell { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); font-weight: 600; }
  .floor-range-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); font-weight: 600; }
  .floor-range-row .floor-range-field { display: flex; align-items: center; gap: 8px; }
  .floor-range-row input:not([type="checkbox"]) { width: 90px; font-family: var(--sans); font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; }
  .floor-range-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .floor-range-to { font-size: 12.5px; color: var(--ink-faint); }
  .floor-range-row input.rc-range-error { border-color: #b3452f; }
  .prop-row-4 { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .prop-row-4 .field { flex: 1 1 180px; margin-bottom: 12px; }
  .prop-row-5 { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .prop-row-5 .floor-range-row { margin-bottom: 0; }
  .rc-select-input { font-family: var(--sans); font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; }
  .rc-select-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .ri-block { padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
  .ri-block:first-of-type { padding-top: 4px; }
  .ri-block:last-child { border-bottom: none; padding-bottom: 4px; }
  .ri-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .ri-header h4 { font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 0; }
  .ri-shortname-input { width: 20ch; font-family: var(--sans); font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; }
  .ri-shortname-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ri-shortname-label { font-size: 11px; color: var(--ink-faint); }

  .ri-image-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  .ri-image-thumb { position: relative; width: 40px; height: 40px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
  .ri-image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ri-thumb-delete { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .ri-video-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .ri-video-row input[type="text"] { font-family: var(--sans); font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; width: 260px; max-width: 100%; }
  .ri-video-row .or-label { font-size: 12px; color: var(--ink-faint); }
  .ri-video-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .ri-video-card { width: 160px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ri-video-card video { width: 100%; border-radius: 5px; background: #000; }
  .ri-video-card .ri-video-link { font-size: 12px; color: var(--accent); word-break: break-all; text-decoration: none; }
  .ri-video-card input[type="text"] { font-size: 12px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); outline: none; }
  .ri-video-card-footer { display: flex; justify-content: space-between; align-items: center; }

  .rc-pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .rc-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 8px 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  .rc-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .rc-pill .rc-pill-x { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 12px; line-height: 1; }
  .rc-pill .rc-pill-x:hover { background: var(--line-soft); color: #b3452f; }
  .rc-pill .rc-pill-x.confirm { width: auto; border-radius: 999px; padding: 0 6px; color: #b3452f; font-weight: 700; font-family: var(--mono); font-size: 10.5px; background: rgba(179,69,47,0.1); }
  .rc-pill-add { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 1px dashed var(--line); background: none; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  .rc-pill-add:hover { border-color: var(--accent); color: var(--accent); }

  .promo-add-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .promo-terms-row { gap: 20px; align-items: flex-start; }
  .promo-term-block { display: flex; flex-direction: column; gap: 6px; }
  .promo-override-room-label { font-size: 12.5px; font-weight: 600; color: var(--ink); min-width: 90px; }

  .promo-room-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .promo-room-pill { font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); cursor: pointer; }

  .promo-addon-text { width: 100%; font-family: var(--sans); font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; resize: vertical; box-sizing: border-box; }

  /* ---- Calculator page - matches the Lease Rate Simulator artifact's own
     design system exactly (same class names/values), since the two are
     meant to merge later. ---- */
  .calc-controls { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 22px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: nowrap; overflow-x: auto; margin-bottom: 32px; }
  .calc-field { display: flex; flex-direction: column; gap: 6px; min-width: 130px; flex-shrink: 0; }
  .calc-field[hidden] { display: none; }

  .calc-field input, .calc-field select { font-family: var(--mono); font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); outline: none; }
  .calc-field input:focus, .calc-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .calc-field.rate { min-width: 160px; }
  .calc-runbtn { font-family: var(--sans); font-weight: 600; font-size: 14px; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 11px 22px; cursor: pointer; height: 41px; flex-shrink: 0; }
  .calc-runbtn:hover { opacity: .9; }
  .calc-pill-btn { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 100px; padding: 8px 18px; cursor: pointer; margin-left: auto; flex-shrink: 0; }
  .calc-pill-btn:hover { background: var(--accent-soft); }
  .calc-pill-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .calc-err { font-family: var(--mono); font-size: 13px; color: #b3452f; margin: -20px 0 26px; }

  .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .calc-grid.single-mode { grid-template-columns: minmax(260px, 360px) 1fr; align-items: start; }
  .calc-grid.single-mode.compare-mode { grid-template-columns: minmax(260px, 360px) minmax(260px, 360px) 1fr; }
  @media (max-width: 760px) { .calc-grid.single-mode, .calc-grid.single-mode.compare-mode { grid-template-columns: 1fr; } }
  .calc-right-col-stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .placeholder-panel { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; min-height: 280px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; }

  /* Lightbox - matches the Lease Rate Simulator artifact's own, exactly */
  .lightbox-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.86); z-index: 9999; align-items: center; justify-content: center; }

  .lightbox-video-placeholder { width: 100%; aspect-ratio: 16/9; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; }
  .lightbox-video-icon { font-size: 36px; color: rgba(255,255,255,0.5); }

  .lightbox-open-link:hover { background: rgba(255,255,255,0.24); }

  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; border: none; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  @media (max-width: 520px) { .lightbox-nav { width: 38px; height: 38px; font-size: 18px; } .lightbox-prev { left: 8px; } .lightbox-next { right: 8px; } }

  .calc-duration { margin: 14px 0 4px; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; }

  .calc-info-btn { width: 17px; height: 17px; margin-bottom: 4px; border-radius: 50%; border: 1px solid var(--ink-soft); background: none; color: var(--ink-soft); font-size: 10.5px; line-height: 1; font-family: var(--sans); font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }

  .calc-payable-today-value { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .calc-total-extra .calc-step { color: var(--ink-soft); padding-left: 12px; }

  /* Rate card summary + promotions panels */

  .calc-promo-value { font-size: 13px; color: var(--ink); margin-bottom: 4px; line-height: 1.5; }
  .calc-promo-daterange { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
  .env-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .env-row:last-child { border-bottom: none; }
  .env-row .k { color: var(--ink-soft); }
  .env-row .v { font-family: var(--mono); font-size: 12.5px; }
  .env-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .env-badge.ok { color: var(--st-available); }
  .env-badge.missing { color: var(--st-unavailable); }
  .env-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .console-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .btn-ghost { background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; font-weight: 500; }
  .btn-ghost:hover { border-color: var(--ink-faint); }
  .save-toast { font-size: 12.5px; color: var(--accent-ink); opacity: 0; transition: opacity .3s; }
  .save-toast.show { opacity: 1; }

  .test-result { margin-top: 14px; padding: 11px 13px; border-radius: 7px; font-size: 12.5px; line-height: 1.5; display: none; white-space: pre-wrap; }
  .test-result.show { display: block; }
  .test-result.ok { background: var(--st-available-bg); color: var(--st-available); }
  .test-result.err { background: var(--st-unavailable-bg); color: var(--st-unavailable); }
  .test-result.info { background: var(--line-soft); color: var(--ink-soft); }

  @media (max-width: 640px) {
    .shell { padding: 20px 14px 48px; }
    thead th.num-col, td.num-col { width: auto; }
    .table-wrap { overflow-x: auto; }
    table { min-width: 520px; }
    .stat-cards { grid-template-columns: repeat(2, 1fr); }
    .res-table { min-width: 640px; }
  }

  /* ---- Top nav (Agent/Room List/Rates/Floor Plan; Setup console stays
     outside this, as its own full page - see renderSetup). Previously a
     left sidebar - moved to a horizontal bar above each page's own header
     so the content column gets the full width, matching the Lease Rate
     Simulator artifact's own single-column layout. ---- */
  .top-nav-wrap { max-width: 1180px; margin: 0 auto; padding: 18px 20px 0; }
  .top-nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .top-nav-tab { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-soft); background: none; border: none; border-radius: 0; border-bottom: 2px solid transparent; padding: 10px 4px; margin-right: 22px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .top-nav-tab:hover { color: var(--ink); }
  .top-nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---- Floor Plan viewer ---- */
  .fp-layout { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .fp-image-col { flex: 1.7; min-width: 280px; display: flex; flex-direction: column; gap: 14px; }
  .fp-floor-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

  .fp-upload-field { display: flex; flex-direction: column; gap: 6px; }
  .fp-upload-field:first-child { flex: 0 0 auto; }
  .fp-upload-field:nth-child(2) { flex: 0 0 auto; }
  .fp-upload-field:nth-child(2) input[type="text"] { width: 15ch; }
  .fp-upload-row input[type="file"] { font-family: var(--sans); font-size: 13px; }
  .fp-upload-row input[type="text"] { font-family: var(--sans); font-size: 14px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; }
  .fp-upload-row input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fp-upload-field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .fp-upload-row .btn-primary { flex-shrink: 0; }
  .fp-floor-tab { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); font-family: var(--mono); font-size: 12.5px; }
  .fp-floor-tab.active { background: var(--accent); border-color: var(--accent); color: #F4FBF8; }
  .fp-image-wrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-height: 200px; display: flex; align-items: center; justify-content: center; }
  .fp-image-wrap img { width: 100%; display: block; }
  .fp-image-placeholder { padding: 40px 20px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }
  .fp-hotspot-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fp-hotspot-poly { fill: var(--accent); fill-opacity: 0.16; stroke: var(--accent); stroke-width: 1.5; cursor: pointer; transition: fill-opacity .12s ease; }
  .fp-hotspot-poly:hover { fill-opacity: 0.32; }
  .fp-hotspot-poly.spotlight { fill: var(--st-unconfirmed); fill-opacity: 0.08; stroke: var(--st-unconfirmed); stroke-width: 2.25; }
  .fp-hotspot-poly.facility { fill: var(--ink-faint); fill-opacity: 0.14; stroke: var(--ink-faint); }
  .fp-point-marker { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--st-unconfirmed); border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); pointer-events: none; }
  .fp-edit-handle { pointer-events: auto; cursor: grab; width: 12px; height: 12px; margin: -6px 0 0 -6px; z-index: 2; }
  .fp-edit-handle:hover { background: var(--accent); }
  .fp-edit-handle:active { cursor: grabbing; }
  .fp-room-list { flex: 1; min-width: 240px; max-height: 620px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .fp-room-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); cursor: pointer; font-size: 13.5px; }
  .fp-room-item:last-child { border-bottom: none; }
  .fp-room-item:hover, .fp-room-item.spotlight { background: var(--line-soft); }
  .fp-filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .fp-filter-row select, .fp-filter-row input[type="date"] { font-family: var(--sans); font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); outline: none; }
  @media (max-width: 720px) {
    .fp-room-list { max-height: 320px; }
  }
</style>
</head>
<body>
<!-- Applies a saved theme override before anything paints, so someone who
     picked "Light" while their system is set to dark (or vice versa)
     never sees a flash of the wrong theme while the main app script is
     still loading below. -->
<script>
(function () {
  try {
    var saved = localStorage.getItem("ysuite-theme");
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
})();
</script>
<div id="app"></div>
<script>
(function () {
  "use strict";

  // Per-tab identity for the Setup Console's soft edit-lock (see rates.js).
  // Regenerated every page load - this is presence detection between
  // concurrent editors, not authentication. holderLabel is a plain display
  // name so a lock banner can say who, not just that someone is editing;
  // asked for once and remembered in this browser via localStorage.
  var SESSION_ID = "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  function editorLabel() {
    try {
      var saved = localStorage.getItem("setupEditorName");
      if (saved) return saved;
      var entered = window.prompt("Your name, so others know who's editing this (optional):", "");
      var label = (entered || "").trim() || "Someone";
      localStorage.setItem("setupEditorName", label);
      return label;
    } catch (e) {
      return "Someone";
    }
  }
  var heartbeatTimer = null;
  var testBtnCountdownTimer = null;

  // Ticks the Sync button's label once a second while it's in
  // its shared cooldown with Sync rooms, so the "too frequent, try again
  // later" error becomes a visible countdown instead of something you
  // only find out by clicking. Pure DOM update, never a full render() -
  // this runs on a timer completely disconnected from anything the person
  // is doing, so it follows the same rule the presence-lock heartbeat fix
  // established: a background timer must never call render(), since that
  // would wipe out a value mid-typed in some other field.
  function startTestBtnCountdown() {
    if (testBtnCountdownTimer) return;
    testBtnCountdownTimer = setInterval(function () {
      var btn = document.getElementById("test-btn");
      if (!btn) { clearInterval(testBtnCountdownTimer); testBtnCountdownTimer = null; return; }
      var remainingMs = (state.nextSyncAllowedAt || 0) - Date.now();
      if (remainingMs <= 0) {
        clearInterval(testBtnCountdownTimer);
        testBtnCountdownTimer = null;
        btn.disabled = state.testing || false;
        btn.textContent = state.testing ? "Syncing…" : "Sync";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Try again in " + formatCountdown(remainingMs);
    }, 1000);
  }


  // Base room type names now come entirely from whatever the last real
  // sync returned (state.rooms), not a hardcoded list - different
  // properties return entirely different room type names, and this needs
  // to work for any of them without a code change. render() recomputes
  // this from state.rooms on every render, same as DISPLAY_TYPES below -
  // so a resync that adds or drops a room type updates Setup automatically
  // too, not just the Agent/Reservation views. Sorted for a stable,
  // predictable order across renders (sync order isn't guaranteed stable).
  var BASE_TYPES = []; // placeholder until the first real sync
  var UNIT_CONFLICT_ROOM_NAMES = []; // recomputed in render() - see computeUnitGenderConflicts

  function computeBaseTypes(rooms) {
    var seen = {};
    var types = [];
    (rooms || []).forEach(function (r) {
      if (r.roomType && !seen[r.roomType]) { seen[r.roomType] = true; types.push(r.roomType); }
    });
    types.sort();
    return types;
  }

  // High Floor From (Property Information): floors below it are Low,
  // floors from it upward are High, unbounded (no property-wide "total
  // floors" is tracked, so there's no natural upper bound to apply - and
  // none is needed, since every real floor is either below this value or
  // at/above it). 0 or blank means the property isn't using a High/Low
  // split at all - resolveTier returns null in that case.
  function resolveTier(floor, floorConfig) {
    if (floor == null || !floorConfig) return null;
    var highFrom = Number(floorConfig.highFloorFrom) || 0;
    if (highFrom <= 0) return null;
    return floor >= highFrom ? "High" : "Low";
  }

  // Per base type, whether its actual synced rooms exist in the High tier,
  // the Low tier, or both - a type only needs a High/Low split at all if
  // it genuinely has rooms on both sides of "High Floor From" (e.g.
  // Ensuite Premium existing only on floors 2 and 4, both below a
  // highFloorFrom of 11, has nothing to split - it's just "Ensuite
  // Premium", full stop, even with the split turned on for the property
  // generally). render() recomputes this from state.rooms on every
  // render, same as BASE_TYPES itself, so a resync updates which types
  // split automatically.
  function computeTierPresence(rooms, floorConfig) {
    var presence = {};
    var highFrom = floorConfig && Number(floorConfig.highFloorFrom) || 0;
    if (highFrom <= 0) return presence; // splitting is off altogether - presence is moot
    (rooms || []).forEach(function (r) {
      if (!r.roomType) return;
      var tier = resolveTier(r.floor, floorConfig);
      if (!tier) return;
      if (!presence[r.roomType]) presence[r.roomType] = { high: false, low: false };
      if (tier === "High") presence[r.roomType].high = true;
      else presence[r.roomType].low = true;
    });
    return presence;
  }

  function typeShouldSplit(base, property, tierPresence) {
    var splitting = property && Number(property.highFloorFrom) > 0;
    if (!splitting) return false;
    var presence = tierPresence && tierPresence[base];
    return !!(presence && presence.high && presence.low);
  }

  // Display rows. Recomputed (not a fixed constant) on every render, from
  // BASE_TYPES, the current property config, and computeTierPresence
  // above - each base type splits into "(High)"/"(Low)" only if it
  // actually needs to (see typeShouldSplit); otherwise it's a single row,
  // the same as when splitting is off for the property altogether.
  var DISPLAY_TYPES = []; // placeholder until the first real sync
  var TIER_PRESENCE = {}; // placeholder until the first real sync

  function computeDisplayTypes(property, baseTypes, tierPresence) {
    var types = [];
    (baseTypes || []).forEach(function (base) {
      if (typeShouldSplit(base, property, tierPresence)) { types.push(base + " (High)"); types.push(base + " (Low)"); }
      else { types.push(base); }
    });
    return types;
  }

  // Shared by both views: resolves one room's display type. kind is
  // "single" | "tiered" | "unmapped" | "unclassified" (a real base type
  // that DOES need splitting, but this floor doesn't fall in either
  // configured range - shouldn't happen in practice since High is
  // unbounded, but handled rather than assumed away). "unmapped" should
  // be rare too - it only happens if a room's type isn't in the current
  // BASE_TYPES list, which recomputes from state.rooms on every render,
  // so it's normally already in sync.
  function resolveDisplayType(r, floorConfig, baseTypes, tierPresence) {
    var base = r.roomType;
    if (!baseTypes || baseTypes.indexOf(base) === -1) {
      return { displayType: null, kind: "unmapped", base: base };
    }
    if (!typeShouldSplit(base, floorConfig, tierPresence)) return { displayType: base, kind: "single" };
    var tier = resolveTier(r.floor, floorConfig);
    if (!tier) return { displayType: null, kind: "unclassified", base: base };
    return { displayType: base + " (" + tier + ")", kind: "tiered" };
  }

  // Local calendar date, not UTC - .toISOString() converts to UTC first,
  // which silently shifts "today" by a day for anyone outside UTC+0 (e.g.
  // it can still read as yesterday well into the morning for someone
  // several hours ahead of UTC). "Today" needs to match the person's own
  // clock, not the server's/UTC's, since that's what a real arrival or
  // departure date is being compared against.
  function todayISO() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function addDaysISO(iso, days) {
    var d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }

  var state = {
    auth: { token: null, username: null, role: null }, // set on login, loaded from localStorage on startup - see loadAll/restoreSession
    loginForm: { mode: "password", username: "", password: "", error: null, submitting: false }, // the login screen's own state, separate from everything else
    view: "agent", // "agent" | "reservation" | "floorplan" | "setup"
    setupTab: "property", // "property" | "roomInfo" | "rateCards" | "promotions" | "floorplan" - sub-tab within the Setup console
    rates: null,          // { property: {...}, list: [RateCard...], activeIndex } - see rates.js
    pendingDeleteCardId: null, // rate card id currently showing "Confirm ×" - two-click delete, see the Rate Card pill row
    pendingDeletePromoId: null, // same pattern, for a promotion's own delete button
    pendingPropertyIdChange: null, // { newId } once a real Property ID change is armed, awaiting confirm - see renderSetupPropertyTab
    promoInfoOpen: false, // "?" popover next to the Promotions header - see renderPromoInfoPopover
    usersTab: { users: [], loaded: false, loading: false, error: null, newUser: { username: "", password: "", role: "admin" }, actionError: null }, // Setup > Users - see renderSetupUsersTab
    connection: null,     // { baseUrl, propertyId, jwtConfigured }
    rooms: [],
    syncedAt: null,
    nextSyncAllowedAt: 0,
    loading: true,
    testing: false,
    testResult: null,     // { ok, text }
    dateRange: { start: "", end: "" }, // blank until picked from the dropdown - see the check-in/check-out rules-driven select in renderAgent
    dateRangeError: null,
    reservation: {
      search: "",
      typeFilter: "",
      statusFilter: "",
      dateStart: "",
      dateEnd: "",
      quickFilter: "", // "" | "occupied" | "arrivingToday" | "departingToday"
      sortKey: "name",
      sortDir: "asc",
      expanded: {},
      expandedOrder: [] // room names in the order they were expanded - oldest first, so a 6th expansion knows which one to evict
    },
    floorplan: {
      hotspots: {},        // { "<floor>": { "<room or facility:id>": {points:[{x,y}]} } }
      facilities: [],      // [ {id, name, scope, deleted?}, ... ]
      floorGroups: {},      // { "<floor>": ["<floor>", ...] } - floors sharing one image, from floorplan-image.js uploads
      loaded: false,
      currentFloor: null,
      spotlightRoom: null, // room name currently highlighted, from clicking the room list
      filters: { roomType: "", status: "", dateStart: "", dateEnd: "" }
    },
    floorplanEdit: {
      floor: null,          // floor currently being edited in Setup
      activeKey: null,      // room name or "facility:<id>" currently being drawn
      drawingPoints: [],    // points placed so far for activeKey, before saving
      newFacilityName: "",
      uploadFloors: "",     // comma-separated floor numbers the next image upload applies to
      saveMsg: null,        // { ok, text }
      uploadMsg: null,
      editMode: false,      // true once "Edit" is clicked on an already-mapped shape - unlocks dragging points/shape
      dragging: null,        // { type: "point", index } | { type: "shape", startX, startY, origPoints } | null - active only during a mouse drag
      uploadAttemptId: 0     // bumped on every upload click - guards a stale attempt's result from overwriting a newer one's
    },
    calculator: {
      checkIn: "",
      checkOut: "",
      roomType: "",        // blank until explicitly chosen - see missingFieldsPrompt
      compareEnabled: false,
      compareRoomType: ""  // ditto
    }
  };

  // Convenience accessor: everywhere that used to read state.propertyName /
  // state.floorConfig now reads through state.rates.property directly, once
  // it's loaded (see loadAll). Kept as tiny helpers rather than renaming
  // every call site, since the underlying object is the same one rates.js
  // persists - mutating it here is exactly what gets saved.
  function propertyName() { return (state.rates && state.rates.property && state.rates.property.propertyName) || ""; }
  function floorConfig() { return (state.rates && state.rates.property) || { highFloorMin: 0, highFloorMax: 0, lowFloorMin: 0, lowFloorMax: 0 }; }

  // ---- API ----
  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {});
    if (state.auth && state.auth.token) headers.Authorization = "Bearer " + state.auth.token;
    return fetch(path, Object.assign({}, opts, { headers: headers })).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (res.status === 401 && state.auth && state.auth.token) {
          // The session expired or was invalidated mid-use (e.g. logged
          // out from another tab) - clear it and fall back to the login
          // screen rather than leaving a half-broken authenticated UI up
          // with every further request failing the same way.
          clearSession();
          render();
        }
        return { ok: res.ok, status: res.status, body: body };
      });
    });
  }

  function renderLockBanner(lock) {
    if (!lock || lock.sessionId === SESSION_ID) return "";
    return '<div class="test-result show info" style="margin-bottom:16px">⚠ ' + escapeHtml(lock.holderLabel || "Someone") + ' is currently editing this — your changes may conflict with theirs when you save.</div>';
  }

  function startHeartbeat() {
    if (heartbeatTimer) return;
    var label = editorLabel();
    function beat() {
      api("/api/rates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "heartbeat", sessionId: SESSION_ID, holderLabel: label }) })
        .then(function (res) {
          if (!res.ok || !state.rates) return;
          state.rates.lock = res.body.lock;
          // Deliberately NOT calling render() here: this runs on a timer
          // regardless of what the user is doing, and a full render()
          // replaces the whole page's innerHTML - which would silently
          // wipe out any text just typed into a field that hasn't been
          // blurred yet (most inputs here only commit on "change", not
          // every keystroke). Only the lock banner needs to reflect a
          // heartbeat response, so only it gets touched.
          var slot = document.getElementById("lock-banner-slot");
          if (slot) slot.innerHTML = renderLockBanner(state.rates.lock);
        });
    }
    beat();
    heartbeatTimer = setInterval(beat, 10000);
  }
  function stopHeartbeat() {
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    api("/api/rates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "release", sessionId: SESSION_ID }) });
  }
  window.addEventListener("beforeunload", function () {
    if (heartbeatTimer) {
      try {
        navigator.sendBeacon && navigator.sendBeacon("/api/rates", JSON.stringify({ action: "release", sessionId: SESSION_ID }));
      } catch (e) {}
    }
  });

  // Scrolling the page while a number input happens to be focused
  // silently changes its value in most browsers - hiding the spin-button
  // arrows (see the CSS) doesn't stop this on its own. Blurring the field
  // on wheel lets the scroll just scroll the page instead, without
  // touching whatever the field currently holds.
  document.addEventListener("wheel", function (e) {
    var el = document.activeElement;
    if (el && el.tagName === "INPUT" && el.type === "number") el.blur();
  }, { passive: true });

  // Calendly widget for the "Book a Room Tour" button - loaded once, at
  // script startup, not per-render: injecting a <link>/<script> pair on
  // every render() would either duplicate them (if not guarded) or need
  // its own guard logic for no benefit, since this never needs to change
  // and only one instance should ever exist on the page. The async
  // script may still be loading by the time someone actually clicks the
  // button; ensureCalendlyPopup (called from the click handler) accounts
  // for that rather than assuming window.Calendly is already there.
  function loadCalendlyWidget() {
    if (document.getElementById("calendly-widget-css")) return; // already injected
    var link = document.createElement("link");
    link.id = "calendly-widget-css";
    link.rel = "stylesheet";
    link.href = "https://assets.calendly.com/assets/external/widget.css";
    document.head.appendChild(link);
    var script = document.createElement("script");
    script.id = "calendly-widget-js";
    script.src = "https://assets.calendly.com/assets/external/widget.js";
    script.async = true;
    document.head.appendChild(script);
  }
  loadCalendlyWidget();

  function ensureCalendlyPopup() {
    if (window.Calendly && window.Calendly.initPopupWidget) {
      window.Calendly.initPopupWidget({ url: "https://calendly.com/ysuitesonmargaret/book-a-room-tour-with-y-suites-on-margaret" });
      return;
    }
    // The widget script loads async and may not be ready yet on a very
    // fast click right after page load - wait briefly and retry a few
    // times rather than silently doing nothing.
    var attempts = 0;
    var retry = setInterval(function () {
      attempts++;
      if (window.Calendly && window.Calendly.initPopupWidget) {
        clearInterval(retry);
        window.Calendly.initPopupWidget({ url: "https://calendly.com/ysuitesonmargaret/book-a-room-tour-with-y-suites-on-margaret" });
      } else if (attempts >= 20) { // ~5s
        clearInterval(retry);
        window.alert("Couldn't load the booking widget - please check your connection and try again.");
      }
    }, 250);
  }

  // A rate card's or promotion's "Confirm ×" (armed by a first click - see
  // the data-delete-card / data-remove-promo handlers in bindEvents)
  // disarms itself if the person clicks anywhere else instead of
  // confirming, so an accidental miss-click elsewhere can never be
  // mistaken for a second confirm later. The Promotions "?" info popover
  // closes the same way - anywhere outside the button or the popover
  // itself dismisses it.
  document.addEventListener("click", function (e) {
    var closest = e.target.closest && e.target.closest.bind(e.target);
    var changed = false;
    if (state.pendingDeleteCardId !== null && !(closest && closest(".rc-pill-x"))) { state.pendingDeleteCardId = null; changed = true; }
    if (state.pendingDeletePromoId !== null && !(closest && closest(".rc-del"))) { state.pendingDeletePromoId = null; changed = true; }
    if (state.promoInfoOpen && !(closest && (closest("#promo-info-btn") || closest("#promo-info-popover")))) { state.promoInfoOpen = false; changed = true; }
    if (changed) render();
  });

  // ---- Auth: session persistence, login page ----
  var SESSION_STORAGE_KEY = "ysimAuthSession";

  function saveSession(auth) {
    state.auth = auth;
    try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(auth)); } catch (err) { /* private browsing etc - session just won't survive a refresh */ }
  }

  function clearSession() {
    state.auth = { token: null, username: null, role: null };
    try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (err) { /* ignore */ }
  }

  function restoreSession() {
    try {
      var raw = localStorage.getItem(SESSION_STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && parsed.token) return parsed;
    } catch (err) { /* corrupt/blocked storage - just treat as logged out */ }
    return null;
  }

  function renderLoginPage() {
    var f = state.loginForm;
    var html = '<div class="login-page"><div class="login-card">';
    html += '<h1 class="login-title">' + escapeHtml(propertyName() || "Availability Simulator") + '</h1>';
    html += '<div class="login-toggle">';
    html += '<button type="button" class="login-toggle-btn' + (f.mode === "password" ? " active" : "") + '" data-login-mode="password">Username &amp; password</button>';
    html += '<button type="button" class="login-toggle-btn' + (f.mode === "agent" ? " active" : "") + '" data-login-mode="agent">Username only</button>';
    html += '</div>';
    html += '<form id="login-form">';
    html += '<div class="field"><label for="login-username">Username</label><input id="login-username" type="text" autocomplete="username" value="' + escapeAttr(f.username) + '" autofocus></div>';
    if (f.mode === "password") {
      html += '<div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" value="' + escapeAttr(f.password) + '"></div>';
    }
    if (f.error) html += '<div class="test-result show err" style="margin:4px 0 12px">' + escapeHtml(f.error) + '</div>';
    html += '<button type="submit" class="btn-primary" style="width:100%"' + (f.submitting ? " disabled" : "") + '>' + (f.submitting ? "Logging in…" : "Log in") + '</button>';
    html += '</form></div></div>';
    return html;
  }

  function bindLoginEvents() {
    document.querySelectorAll("[data-login-mode]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.loginForm.mode = btn.getAttribute("data-login-mode");
        state.loginForm.error = null;
        render();
      });
    });
    var usernameEl = document.getElementById("login-username");
    if (usernameEl) usernameEl.addEventListener("input", function () { state.loginForm.username = usernameEl.value; });
    var passwordEl = document.getElementById("login-password");
    if (passwordEl) passwordEl.addEventListener("input", function () { state.loginForm.password = passwordEl.value; });

    var form = document.getElementById("login-form");
    if (form) form.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = state.loginForm;
      if (!f.username.trim()) { f.error = "Enter a username."; render(); return; }
      if (f.mode === "password" && !f.password) { f.error = "Enter a password."; render(); return; }
      f.submitting = true; f.error = null; render();
      var payload = { action: "login", username: f.username.trim() };
      if (f.mode === "password") payload.password = f.password;
      api("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(function (res) {
        f.submitting = false;
        if (res.ok) {
          saveSession({ token: res.body.token, username: res.body.username, role: res.body.role });
          state.loginForm = { mode: "password", username: "", password: "", error: null, submitting: false };
          loadAll();
        } else {
          f.error = (res.body && res.body.error) || "Login failed.";
          render();
        }
      }).catch(function () {
        f.submitting = false;
        f.error = "Login failed: network error.";
        render();
      });
    });
  }

  function logout() {
    var token = state.auth.token;
    clearSession();
    render();
    if (token) api("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "logout", token: token }) });
  }

  function loadAll() {
    state.loading = true;
    render();
    Promise.all([api("/api/rates"), api("/api/availability"), api("/api/floorplan")]).then(function (results) {
      var rates = results[0], avail = results[1], fp = results[2];
      if (rates.ok) state.rates = rates.body;
      if (avail.ok) {
        state.rooms = avail.body.rooms || [];
        state.syncedAt = avail.body.syncedAt || null;
        state.nextSyncAllowedAt = avail.body.nextSyncAllowedAt || 0;
        state.connection = avail.body.connection || null;
      }
      if (fp.ok) {
        state.floorplan.hotspots = fp.body.hotspots || {};
        state.floorplan.facilities = fp.body.facilities || [];
        state.floorplan.floorGroups = fp.body.floorGroups || {};
        state.floorplan.loaded = true;
        if (state.floorplan.currentFloor == null) {
          var floors = Object.keys(state.floorplan.hotspots).map(Number).sort(function (a, b) { return a - b; });
          if (floors.length) state.floorplan.currentFloor = floors[0];
        }
      }
      state.loading = false;
      render();
    }).catch(function () {
      state.loading = false;
      render();

  // ---- availability logic ----
  function isRoomAvailableForRange(r, start, end) {
    if (r.status === "unavailable") return false;
    if (r.status === "available") {
      if (!start || !end || !r.availableUntil) return true;
      return end <= r.availableUntil;
    }
    if (!start || !end) return false;
    if (!r.leaseStart || !r.leaseEnd) return false;
    return end < r.leaseStart || start > r.leaseEnd;
  }

  // Title -> gender mapping, exactly as specified: Mrs/Ms/Miss = Female,
  // Mr/Mr. = Male. Anything else (Dr, Prof, no title at all) gives no
  // answer from Title, falling through to Gender instead.
  var TITLE_FEMALE = ["mrs", "ms", "miss"];
  var TITLE_MALE = ["mr", "mr."];
  function genderFromTitle(title) {
    if (!title) return null;
    var t = String(title).trim().toLowerCase();
    if (TITLE_FEMALE.indexOf(t) !== -1) return "female";
    if (TITLE_MALE.indexOf(t) !== -1) return "male";
    return null;
  }

  // Combines Title and Gender - Title takes priority when it gives an
  // answer, Gender is the fallback when Title doesn't (no title, or a
  // title like Dr/Prof that doesn't map to a gender). If BOTH give an
  // answer and they disagree (e.g. Title "Mr" but Gender "Female"), that's
  // a real data problem worth surfacing rather than silently trusting
  // Title and hiding the conflict - returned as a mismatch instead of a
  // gender, so it's excluded from the Male/Female counts rather than
  // silently landing in the wrong one.
  function effectiveGender(r) {
    var fromTitle = genderFromTitle(r.title);
    var fromGender = r.gender || null;
    if (fromTitle && fromGender && fromTitle !== fromGender) return { gender: null, mismatch: true };
    return { gender: fromTitle || fromGender || null, mismatch: false };
  }

  // Used by the "N Mismatch" button in the topbar - every room across the
  // whole synced list (not scoped to shared units, unlike the Agent
  // table's own Title/Gender count) where Title and Gender actively
  // disagree once Title is converted to male/female first.
  function countTitleGenderMismatches(rooms) {
    return (rooms || []).filter(function (r) { return effectiveGender(r).mismatch; }).length;
  }

  // Used by the "N Unit ⚠" button - independent of Title/Gender mismatch
  // (a room's own data agreeing with itself doesn't mean it agrees with
  // its unit-mate): counts shared UNITS (not rooms) where the bedrooms
  // currently show different genders from each other, e.g. one male and
  // one female guest booked into the same apartment. Returns both the
  // unit count (what the button displays) and the individual room names
  // involved (both bedrooms of every conflicting unit), so Reservation
  // can filter down to exactly those rooms when the button is clicked.
  function computeUnitGenderConflicts(rooms, floorCfg) {
    var unitGroups = {};
    (rooms || []).forEach(function (r) {
      if (!r.shared) return;
      var resolved = resolveDisplayType(r, floorCfg, BASE_TYPES, TIER_PRESENCE);
      if (resolved.kind === "unmapped" || resolved.kind === "unclassified") return;
      var key = resolved.displayType + "|" + r.unitKey;
      if (!unitGroups[key]) unitGroups[key] = { rooms: [], genders: {} };
      var eg = effectiveGender(r);
      unitGroups[key].rooms.push(r.name);
      if (eg.gender) unitGroups[key].genders[eg.gender] = true;
    });
    var count = 0, roomNames = [];
    Object.keys(unitGroups).forEach(function (key) {
      var grp = unitGroups[key];
      if (Object.keys(grp.genders).length > 1) {
        count += 1;
        roomNames = roomNames.concat(grp.rooms);
      }
    });
    return { count: count, roomNames: roomNames };
  }

  // Room Name Conditioning: replaces the old hard-coded "floor.unit.bed
  // name" parsing with a per-property configurable one, since different
  // properties' YSuite instances name rooms differently and a single
  // fixed pattern silently mis-groups shared units on any property that
  // doesn't match it (the "1 gender unaccounted for" report traced back
  // to exactly this). Splits a room name on whitespace and common
  // separators into positional fields; the property then assigns each
  // field position a role (Flooring / Unit / Shared-Not / Short Name)
  // once, and that same mapping applies to every room uniformly.
  function splitRoomNameFields(name) {
    return String(name || "").split(/[\s.\-_/]+/).filter(Boolean);
  }

  // Flooring is expected to be numeric, but as a fail-safe for a property
  // that names floors with letters instead (A, B, C...), falls back to a
  // simple letter-to-number scheme: a=1, b=2, ... z=26, and beyond that a
  // spreadsheet-column-style extension (aa=27, ab=28...) for the unlikely
  // case of a multi-letter flooring token - deterministic either way, so
  // High/Low tiering and Floor Plan's own floor tabs still have a real
  // number to sort and compare on.
  function parseFlooringValue(raw) {
    var s = String(raw == null ? "" : raw).trim();
    if (!s) return null;
    var n = Number(s);
    if (!isNaN(n)) return n;
    var lower = s.toLowerCase();
    if (/^[a-z]+$/.test(lower)) {
      var result = 0;
      for (var i = 0; i < lower.length; i++) result = result * 26 + (lower.charCodeAt(i) - 96);
      return result;
    }
    return null;
  }

  // One example (and one independently-configured field-role mapping)
  // per DISTINCT field count actually present across the synced rooms -
  // not a single example for whichever room happens to have the most
  // fields. A property can genuinely mix naming conventions (most rooms
  // named with 3 tokens, a different subset with 4), and forcing
  // everything through one fixed pattern left whichever count wasn't the
  // "most fields" one unclassified even though its own pattern was
  // perfectly parseable on its own terms - exactly what was behind rooms
  // going missing from listings and tier splitting looking incomplete.
  function pickExampleRoomNamesByCount(rooms) {
    var byCount = {};
    (rooms || []).forEach(function (r) {
      var count = splitRoomNameFields(r.name).length;
      if (count > 0 && !byCount[count]) byCount[count] = r.name;
    });
    return byCount;
  }

  // Re-derives floor/shared/unitKey for every room from the property's
  // own configured field roles, overriding whatever the backend's
  // generic parsing produced - a no-op when no configuration has been
  // set yet (leaves the backend-derived values exactly as they were, so
  // a property that hasn't set this up keeps working as before). Each
  // room is matched against the pattern for its OWN field count
  // (property.roomNameFieldsByCount, keyed by count) - a room whose
  // count has no configured pattern at all is left unclassified (floor
  // and unitKey null) rather than guessed at. "Shared" is determined per
  // Jeremy's own proposal: group rooms by (Flooring, Unit); if every room
  // in that group shares one identical Shared-Not value, it's a single
  // room, not a shared apartment - it only becomes "shared" once more
  // than one distinct Shared-Not value shows up for the same
  // Flooring+Unit combination, one bedroom per distinct value.
  function applyRoomNameConditioning(rooms, property) {
    var byCount = property && property.roomNameFieldsByCount;
    if (!byCount || !Object.keys(byCount).length) return;

    var parsed = (rooms || []).map(function (r) {
      var fields = splitRoomNameFields(r.name);
      var fieldRoles = byCount[String(fields.length)];
      if (!fieldRoles) return { room: r, ok: false };
      var flooringIdx = fieldRoles.indexOf("flooring");
      var unitIdx = fieldRoles.indexOf("unit");
      var sharedNotIdx = fieldRoles.indexOf("sharedNot");
      return {
        room: r, ok: true,
        flooringRaw: flooringIdx !== -1 ? fields[flooringIdx] : null,
        unitRaw: unitIdx !== -1 ? fields[unitIdx] : null,
        sharedNotRaw: sharedNotIdx !== -1 ? fields[sharedNotIdx] : null
      };
    });

    var groups = {};
    parsed.forEach(function (p) {
      if (!p.ok) return;
      var key = p.flooringRaw + "|" + p.unitRaw;
      if (!groups[key]) groups[key] = {};
      groups[key][p.sharedNotRaw] = true;
    });

    parsed.forEach(function (p) {
      var r = p.room;
      if (!p.ok) {
        r.floor = null; r.shared = false; r.unitKey = null;
        return;
      }
      r.floor = parseFlooringValue(p.flooringRaw);
      var key = p.flooringRaw + "|" + p.unitRaw;
      r.unitKey = key;
      r.shared = Object.keys(groups[key] || {}).length > 1;
    });
  }

  // Property Information's "Short name" field used to be typed in by
  // hand; once a Short Name role is assigned to any configured pattern,
  // it's derived straight from the first room matching that pattern
  // instead (every room shares the same short-name token), and the field
  // becomes read-only display text - no more hand-entry needed or
  // possible. Checks every configured pattern, not just one, since the
  // Short Name role might only be assigned on one of them (e.g. only the
  // 4-field pattern includes a short-name token at all).
  function deriveShortNameFromRooms(rooms, property) {
    var byCount = property && property.roomNameFieldsByCount;
    if (!byCount) return null;
    for (var i = 0; i < (rooms || []).length; i++) {
      var fields = splitRoomNameFields(rooms[i].name);
      var fieldRoles = byCount[String(fields.length)];
      if (!fieldRoles) continue;
      var idx = fieldRoles.indexOf("shortName");
      if (idx !== -1) return fields[idx];
    }
    return null;
  }

  function computeAvailability(rooms, start, end, floorConfig) {
    var byType = {}, genderByType = {}, unmapped = {}, sharedTypes = {};
    var unclassifiedFloors = {}; // base type -> count of rooms whose floor matched neither High nor Low
    DISPLAY_TYPES.forEach(function (t) {
      byType[t] = 0;
      genderByType[t] = { male: 0, female: 0, fullUnit: 0, conflicts: 0, titleMismatch: 0 };
    });
    var total = 0;
    var unitGroups = {};

    rooms.forEach(function (r) {
      var resolved = resolveDisplayType(r, floorConfig, BASE_TYPES, TIER_PRESENCE);
      if (resolved.kind === "unclassified") {
        unclassifiedFloors[resolved.base] = (unclassifiedFloors[resolved.base] || 0) + 1;
        return;
      }
      if (resolved.kind === "unmapped") {
        unmapped[resolved.base || "(missing room type)"] = (unmapped[resolved.base || "(missing room type)"] || 0) + 1;
        return;
      }
      var displayType = resolved.displayType;

      var available = isRoomAvailableForRange(r, start, end);
      if (available) { byType[displayType] += 1; total += 1; }

      // Shared-unit detection is empirical (from the room name itself, r.shared),
      // not from the type name - so it works regardless of which base type a
      // multi-bedroom unit turns out to belong to. Tracked whether or not the
      // room is currently available, so the row's gender-split line doesn't
      // flicker on/off as the date range changes.
      if (r.shared) {
        sharedTypes[displayType] = true;
        var eg = effectiveGender(r);
        if (eg.mismatch) genderByType[displayType].titleMismatch += 1;
        var key = displayType + "|" + r.unitKey;
        if (!unitGroups[key]) unitGroups[key] = { type: displayType, size: 0, availableCount: 0, genders: {} };
        unitGroups[key].size += 1;
        if (available) unitGroups[key].availableCount += 1;
        if (eg.gender) unitGroups[key].genders[eg.gender] = true;
      }
    });

    Object.keys(unitGroups).forEach(function (key) {
      var grp = unitGroups[key];
      var genders = Object.keys(grp.genders);
      if (genders.length > 1) {
        genderByType[grp.type].conflicts += 1;
      } else if (genders.length === 1) {
        genderByType[grp.type][genders[0]] += grp.availableCount;
      } else if (grp.availableCount === grp.size) {
        genderByType[grp.type].fullUnit += 1;
      }
    });

    return { byType: byType, total: total, genderByType: genderByType, unmapped: unmapped, unclassifiedFloors: unclassifiedFloors, sharedTypes: sharedTypes };
  }

  function availabilityPill(n) {
    if (n > 20) return { label: "Available", cls: "pill-avail" };
    if (n >= 10) return { label: "Limited", cls: "pill-selling" };
    if (n >= 1) return { label: n === 1 ? "Last Room" : "Last " + n + " rooms", cls: "pill-last" };
    return { label: "Sold Out", cls: "pill-none" };
  }

  function fmtAgo(iso) {
    if (!iso) return "never";
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return "just now";
    var m = Math.floor(s / 60);
    if (m < 60) return m + " min ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + " hr ago";
    return Math.floor(h / 24) + " day ago";
  }
