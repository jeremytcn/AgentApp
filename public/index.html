      html += '<input type="number" step="0.1" min="0" style="width:50px" id="f-stampDutyPercent" value="' + escapeAttr(numOrEmpty(prop.stampDutyPercent)) + '"><span class="floor-range-to">%</span>';
    }
    html += '</div></div>';
    html += '</div>';

    html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="console-section-label spaced" style="margin:0">Connection (from environment)</div>' + renderTestConnectionBtn() + '</div>';
    if (state.testResult) html += '<div class="test-result show ' + (state.testResult.ok ? "ok" : "err") + '" style="margin-top:10px">' + escapeHtml(state.testResult.text) + '</div>';
    html += '<div class="env-row"><span class="k" style="color:var(--ink)">API base URL</span><span class="v">' + escapeHtml(conn.baseUrl || "—") + '</span></div>';
    html += '<div class="env-row"><span class="k" style="color:var(--ink)">JWT</span><span>' + (conn.jwtConfigured ? '<span class="env-badge ok"><span class="dot"></span>Configured</span>' : '<span class="env-badge missing"><span class="dot"></span>Not set</span>') + '</span></div>';

    html += '</div>';

    html += renderSaveBar();
    return html;
  }

  // "2m 15s" / "45s" - used for the Sync button's cooldown
  // countdown. Rounds up to whole seconds so it never shows "0s" while
  // still technically blocked, and never displays "0m" (drops the minutes
  // part entirely once it's not needed).
  function formatCountdown(ms) {
    var totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return m > 0 ? (m + "m " + s + "s") : (s + "s");
  }

  // Extracted so it can render beside the Connection header, not just at
  // the bottom of the page in renderSaveBar - the button and its own
  // cooldown/testing state don't change based on where it's drawn.
  function renderTestConnectionBtn() {
    var cooldownActive = state.nextSyncAllowedAt && Date.now() < state.nextSyncAllowedAt;
    var label = state.testing ? "Syncing…" : (cooldownActive ? "Try again in " + formatCountdown(state.nextSyncAllowedAt - Date.now()) : "Sync");
    return '<button class="btn-ghost" id="test-btn"' + ((state.testing || cooldownActive) ? " disabled" : "") + '>' + label + '</button>';
  }

  function renderSaveBar() {
    var html = '<div class="console-actions">';
    html += '<span class="save-toast" id="save-toast">Saved</span>';
    html += '</div>';
    return html;
  }

  // Every edit in Setup saves itself immediately (see autoSaveRates) - there
  // is no separate Save button anywhere in this console.
  //
  // On success, this deliberately does NOT call the full render(): it's
  // invoked from a field's own "change" handler (i.e. after that field
  // already lost focus), but the network round-trip can still take long
  // enough for the user to have clicked into and started typing in a
  // DIFFERENT field by the time this resolves - a full render() at that
  // point would wipe out that in-progress value, the exact same class of
  // bug the presence-lock heartbeat caused earlier. Only the lock banner
  // (which nothing else touches) gets updated, surgically, the same way
  // the heartbeat does it.
  //
  // A genuine version conflict is the one case that DOES force a full
  // render(): at that point state.rates is being wholesale replaced with
  // the server's current truth, so every field needs to reflect that
  // regardless of what else was being edited.
  //
  // Debounced + single-flight, on purpose: with no Save button, tabbing
  // through something like the 21-cell Rate Cards pricing grid fires one
  // "change" per cell in quick succession. Without this, each would kick
  // off its own save carrying the version it saw BEFORE any of the earlier
  // ones landed - so a fast run of edits from the SAME person, in the SAME
  // session, could spuriously conflict with each other and silently lose
  // some of them. Debouncing coalesces a fast burst into one save; the
  // single-flight + "pending" flag makes sure a change that arrives while
  // a save is already in the air gets its own follow-up save (capturing
  // whatever's true by then) instead of being dropped or racing it.
  var autoSaveTimer = null;
  var autoSaveInFlight = false;
  var autoSavePending = false;

  function autoSaveRates() {
    if (!state.rates) return;
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(performAutoSave, 500);
  }

  function performAutoSave() {
    autoSaveTimer = null;
    if (autoSaveInFlight) { autoSavePending = true; return; }
    autoSaveInFlight = true;
    var payload = {
      action: "save",
      config: { property: state.rates.property, list: state.rates.list, activeIndex: state.rates.activeIndex },
      expectedVersion: state.rates._version || 0,
      sessionId: SESSION_ID,
      holderLabel: editorLabel()
    };
    api("/api/rates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (res) {
        autoSaveInFlight = false;
        if (res.ok) {
          // Deliberately NOT `state.rates = res.body` here: on success the
          // server just echoes back exactly what was sent (plus a new
          // _version/lock), so there's nothing to adopt into .property/
          // .list/.activeIndex - and replacing those would swap in a
          // brand-new object tree parsed from JSON, silently orphaning
          // every reference already captured by an event handler (like
          // Rate Cards' rcActiveCard) without any render() to reattach
          // them. Whatever the user typed or clicked next would then
          // mutate that orphaned tree instead of the one actually on
          // screen - invisible until the next render, at which point it
          // looks exactly like "everything just reverted to empty". Only
          // the two fields that actually changed get updated in place.
          state.rates._version = res.body._version;
          state.rates.lock = res.body.lock;
          var slot = document.getElementById("lock-banner-slot");
          if (slot) slot.innerHTML = renderLockBanner(state.rates.lock);
          var toast = document.getElementById("save-toast");
          if (toast) { toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 1500); }
        } else if (res.status === 409) {
          // A genuine conflict is different: the server's state really
          // does differ from what was sent, so the local edit is already
          // invalid - adopting the server's full response here (and the
          // render() right after, which rebinds every handler against it)
          // is correct, not a repeat of the bug above.
          state.rates = res.body;
          state.testResult = { ok: false, text: (res.body && res.body.error) || "Save conflict - the values shown now are current; please redo your last change." };
          render();
        } else {
          window.alert((res.body && res.body.error) || "Save failed - your last change may not have been saved. Please try again.");
        }
        if (autoSavePending) { autoSavePending = false; performAutoSave(); }
      })
      .catch(function () {
        autoSaveInFlight = false;
        window.alert("Save failed - network error. Your last change may not have been saved.");
        if (autoSavePending) { autoSavePending = false; performAutoSave(); }
      });
  }

  // ---- Setup > Room Information tab: images, videos, and short names for
  // each real room type (DISPLAY_TYPES), shared by name across every rate
  // card - see HANDOVER.md §1.3 and §2.2. Uploads hit rates-media.js
  // immediately (so the asset exists as soon as it's picked), but adding
  // that asset's id into the config, editing a short name, a caption, or a
  // link only takes effect once Save changes is clicked - same as every
  // other field in this console, so one save-conflict story covers all of
  // it rather than having uploads bypass version-checking.
  // ---- Setup > Rate Cards tab ----
  function newRateCard() {
    return {
      id: "card_" + Math.random().toString(36).slice(2, 10),
      name: "",
      utilities: 0,
      columns: [
        { label: "Short-Term", minNights: 0, maxNights: 90 },
        { label: "Half-Year", minNights: 91, maxNights: 240 },
        { label: "Full-Year", minNights: 241, maxNights: null }
      ],
      rows: DISPLAY_TYPES.map(function (name) { return { name: name, prices: [0, 0, 0] }; }),
      hotRooms: {}, // room type name -> { enabled, quantity } - per card, same as prices
      promotions: { list: [] },
      availability: { rules: [] },
      checkOutAvailability: { rules: [] }
    };
  }

  // Room type rows are locked to DISPLAY_TYPES (see the design note in
  // README/HANDOVER) rather than the prototype's 8 free-typed slots -
  // reconcile whatever a card currently has against that fixed list,
  // preserving any existing prices by name and dropping/adding rows so
  // every card always has exactly one row per DISPLAY_TYPES entry, in the
  // same order. Idempotent - safe to call on every render.
  function reconcileCardRows(card) {
    var byName = {};
    (card.rows || []).forEach(function (r) { if (r && r.name) byName[r.name] = r; });
    card.rows = DISPLAY_TYPES.map(function (name) {
      return byName[name] || { name: name, prices: [0, 0, 0] };
    });
    return card.rows;
  }

  function termsOverlap(columns) {
    function bounds(c) { return [Number(c.minNights) || 0, c.maxNights == null || c.maxNights === "" ? Infinity : Number(c.maxNights)]; }
    for (var i = 0; i < columns.length; i++) {
      for (var j = i + 1; j < columns.length; j++) {
        var a = bounds(columns[i]), b = bounds(columns[j]);
        if (a[0] <= b[1] && b[0] <= a[1]) return true;
      }
    }
    return false;
  }

  // ---- Check-in / Check-out Availability rules (HANDOVER.md §1.4, §2.5) ----
  var WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // Matches the spec's own pseudocode exactly (expandRule(r).includes(checkInVal))
  // so the eventual calculator's card-resolution logic can reuse this
  // unchanged. Capped at ~10 years of days as a sanity guard against an
  // accidentally huge range, not a real limit on valid data.
  function expandRule(rule) {
    if (rule.tier1 !== "range") return [rule.startDate];
    var dates = [];
    var cur = rule.startDate;
    var guard = 0;
    while (cur <= rule.endDate && guard < 3660) {
      if (rule.weekday === "" || rule.weekday == null) {
        dates.push(cur);
      } else {
        var dow = new Date(cur + "T00:00:00Z").getUTCDay();
        if (String(dow) === String(rule.weekday)) dates.push(cur);
      }
      cur = addDaysISO(cur, 1);
      guard++;
    }
    return dates;
  }

  // A lighter-weight raw date-span check (weekday-agnostic) used only for
  // the Check-in non-overlap validation at add-time - not for the
  // eventual calculator, which uses expandRule directly per the spec.
  // Ignoring weekday here is deliberately conservative: it may reject a
  // pair of ranges that wouldn't actually collide on any real calendar
  // date once weekday-filtered, but never lets a genuine ambiguity
  // through, which is what this check exists to prevent.
  function ruleSpan(rule) {
    var end = (rule.tier1 === "range" && rule.endDate) ? rule.endDate : rule.startDate;
    return { start: rule.startDate, end: end };
  }
  function spansOverlap(a, b) { return a.start <= b.end && b.start <= a.end; }
  function checkInOverlapsOtherCards(newRule, currentCardId) {
    var span = ruleSpan(newRule);
    return (state.rates.list || []).some(function (c) {
      if (c.id === currentCardId) return false;
      return (c.availability.rules || []).some(function (r) { return spansOverlap(span, ruleSpan(r)); });
    });
  }

  function renderAvailabilityField(card, fieldKey, sectionTitle, isCheckIn) {
    var field = card[fieldKey] || { rules: [] };
    var rules = field.rules || [];
    var html = '<div class="console-section-label spaced">' + escapeHtml(sectionTitle) + '</div>';
    html += '<div class="av-add-row">';
    html += '<div class="av-add-field"><label>Start date</label><input type="date" id="av-start-' + fieldKey + '"></div>';
    html += '<div class="av-add-field"><label>End date</label><input type="date" id="av-end-' + fieldKey + '"></div>';
    html += '<div class="av-add-field"><label>Day of week</label><select id="av-weekday-' + fieldKey + '" disabled><option value="">Any day</option>';
    WEEKDAY_LABELS.forEach(function (lbl, i) { html += '<option value="' + i + '">' + lbl + '</option>'; });
    html += '</select></div>';
    html += '<button type="button" class="btn-ghost" data-add-rule="' + fieldKey + '" data-checkin="' + (isCheckIn ? "1" : "0") + '">+ Add</button>';
    html += '</div>';

    if (rules.length) {
      html += '<div class="av-pill-grid">';
      rules.forEach(function (r, i) {
        var label = r.tier1 === "single"
          ? formatDateDMY(r.startDate)
          : (formatDateDMY(r.startDate) + " – " + formatDateDMY(r.endDate) + (r.weekday !== "" && r.weekday != null ? " (" + WEEKDAY_LABELS[Number(r.weekday)] + ")" : ""));
        html += '<div class="av-pill ' + (r.tier1 === "range" ? "av-pill-range" : "av-pill-single") + '"><span>' + escapeHtml(label) + '</span>' +
          '<button type="button" class="av-pill-x" data-remove-rule="' + fieldKey + '" data-rule-index="' + i + '">×</button></div>';
      });
      html += '</div>';
    } else {
      html += '<p style="color:var(--ink-faint);font-size:12.5px;margin:8px 0 0">No rules — unrestricted (any date is valid).</p>';
    }
    return html;
  }

  function renderRateCardPillRow(list, activeIndex) {
    var html = '<div class="rc-pill-row">';
    list.forEach(function (card, idx) {
      html += '<button type="button" class="rc-pill' + (idx === activeIndex ? " active" : "") + '" data-select-card="' + idx + '">' +
        escapeHtml(card.name || "Untitled");
      if (list.length > 1) {
        var pending = state.pendingDeleteCardId === card.id;
        html += '<span class="rc-pill-x' + (pending ? " confirm" : "") + '" data-delete-card="' + idx + '" title="' + (pending ? "Click again to permanently remove" : "Remove this rate card") + '">' + (pending ? "Confirm ×" : "×") + '</span>';
      }
      html += '</button>';
    });
    html += '<button type="button" class="rc-pill-add" id="rc-add-card-btn">+ Add rate card</button>';
    html += '</div>';
    return html;
  }

  // Clamps state.rates.activeIndex into range and returns it - shared by
  // Rate Cards and Promotions tabs so both stay in sync with whichever
  // index bindEvents' active-card lookups use.
  function clampActiveCardIndex(list) {
    var idx = Math.max(0, Math.min(state.rates.activeIndex || 0, list.length - 1));
    state.rates.activeIndex = idx;
    return idx;
  }

  // Room types now come entirely from the last real sync (BASE_TYPES),
  // not a hardcoded list - so there's nothing meaningful to configure in
  // Room Information, Rate Cards, or Promotions until at least one sync
  // has actually returned room data. Shown in place of each of those
  // tabs' normal content when BASE_TYPES is still empty.
  function syncRequiredNotice() {
    return '<div class="console-body"><div class="empty-state" style="padding:40px 20px"><h2>Sync required</h2>' +
      '<p>Room types here come from your last sync with YSuite, so this tab has nothing to show until at least one sync has run. Head to Setup &gt; Property Information and click "Sync" to sync first.</p></div></div>';
  }

  function renderSetupRateCardsTab() {
    if (!state.rates) return '<div class="console-body"></div>';
    if (!BASE_TYPES.length) return syncRequiredNotice();
    var list = state.rates.list || [];
    var periodWord = (state.rates.property && state.rates.property.rateType) === "Weekly" ? "Weekly" : "Monthly";

    var html = renderRateCardPillRow(list, state.rates.activeIndex);

    if (!list.length) {
      html += '<div class="console-body"><p style="color:var(--ink-soft);font-size:13.5px;margin:0">No rate cards yet — click "+ Add rate card" above to create one.</p></div>';
      return html;
    }

    var idx = clampActiveCardIndex(list);
    var card = list[idx];
    reconcileCardRows(card);
    var overlap = termsOverlap(card.columns);

    html += '<div class="console-body">';
    html += '<div class="rc-row-extra">';
    html += '<div class="rc-extra-field"><span>Name</span><input id="rc-name" type="text" maxlength="30" class="rc-col-name-input rc-w-name30" value="' + escapeAttr(card.name) + '" placeholder="Rate Card"></div>';
    html += '<div class="rc-extra-field"><span>Utilities (' + periodWord + ')</span><input id="rc-utilities" type="number" min="0" class="rc-num-input rc-w-num10" value="' + escapeAttr(numOrEmpty(card.utilities)) + '"></div>';
    html += '</div>';

    html += '<div class="console-section-label spaced">Lease Terms</div>';
    if (overlap) html += '<div class="rc-warning">⚠ Night ranges below overlap — each lease term should cover a distinct range.</div>';
    html += '<div class="rc-col-fixed-row">';
    card.columns.forEach(function (col, colIdx) {
      html += '<div class="rc-col-fixed-block">';
      html += '<input type="text" maxlength="30" class="rc-col-name-input" placeholder="Lease term name" data-term-label="' + colIdx + '" value="' + escapeAttr(col.label) + '">';
      html += '<div class="rc-col-fixed-range"><input type="number" min="0" class="rc-range-input' + (overlap ? " rc-range-error" : "") + '" data-term-min="' + colIdx + '" value="' + escapeAttr(col.minNights || 0) + '">';
      html += '<span class="rc-range-to">to</span><input type="number" min="0" class="rc-range-input' + (overlap ? " rc-range-error" : "") + '" data-term-max="' + colIdx + '" value="' + escapeAttr(col.maxNights == null ? "" : col.maxNights) + '" placeholder="∞"><span class="rc-range-to">nights</span></div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="console-section-label spaced">Room Types</div>';
    html += '<div class="hint" style="margin:-4px 0 10px">Hot Room overrides what Agent shows as Available for that type on this rate card - the Override Qty always applies regardless of the 🔥 toggle; the toggle only controls whether the icon shows next to the room type\'s name.</div>';
    html += '<table class="rc-room-table"><thead><tr><th>Room type</th><th class="rc-price-col">🔥</th><th class="rc-price-col">Override Qty</th>';
    card.columns.forEach(function (col) { html += '<th class="rc-price-col">' + escapeHtml(col.label) + '</th>'; });
    html += '</tr></thead><tbody>';
    var hotRooms = card.hotRooms || {};
    card.rows.forEach(function (row, rowIdx) {
      var hot = hotRooms[row.name] || { enabled: false, quantity: null };
      html += '<tr><td>' + escapeHtml(row.name) + '</td>';
      html += '<td class="rc-price-col"><label class="hot-room-toggle"><input type="checkbox" data-hotroom-enabled="' + escapeAttr(row.name) + '"' + (hot.enabled ? " checked" : "") + '><span></span></label></td>';
      html += '<td class="rc-price-col"><input type="number" min="0" class="hot-room-qty" placeholder="—" data-hotroom-qty="' + escapeAttr(row.name) + '" value="' + escapeAttr(hot.quantity == null ? "" : hot.quantity) + '"></td>';
      row.prices.forEach(function (price, priceIdx) {
        html += '<td class="rc-price-col"><input type="number" step="0.01" data-row-index="' + rowIdx + '" data-price-index="' + priceIdx + '" value="' + escapeAttr(numOrEmpty(price)) + '"></td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';

    html += renderAvailabilityField(card, "availability", "Check-in Availability", true);
    html += renderAvailabilityField(card, "checkOutAvailability", "Check-out Availability", false);

    html += '</div>';
    html += renderSaveBar();
    return html;
  }

  // ---- Setup > Promotions tab (HANDOVER.md §3.5-§3.9 data model) ----
  function newPromotion(fieldType) {
    return {
      id: "promo_" + Math.random().toString(36).slice(2, 10),
      name: "",
      fieldType: fieldType || "weeklyRateRebate",
      subType: "rates",
      roomTypeNames: [],
      startDate: "",
      endDate: "",
      roomOverrides: {},
      ratesSourceTerms: [],
      ratesTargetTerm: 0,
      discountTermIndices: [],
      discountAmount: 0,
      addOnText: "",
      amounts: [0, 0, 0],
      midLeasePercents: [0, 0, 0],
      utilitiesDiscountAmount: 0
    };
  }

  // Empty roomTypeNames normally means "applies to every room type" - but
  // Override is different: it needs an explicit per-room manual price to
  // mean anything at all, so no rooms selected genuinely means no rooms
  // in scope, not "every room type gets an override" (which wouldn't even
  // make sense - there'd be no prices to apply).
  function promoRoomsInScope(promo) {
    if (promo.roomTypeNames && promo.roomTypeNames.length) return promo.roomTypeNames;
    return promo.subType === "override" ? [] : DISPLAY_TYPES;
  }

  // Weekly Rate Rebate promos only - which (room, term) combinations this
  // promo currently controls, as "<room>|<termIdx>" strings. Used only by
  // the conflict check below - see HANDOVER.md §3.6 for why each sub-type
  // is read differently here.
  function touchedCombos(promo) {
    if (promo.fieldType !== "weeklyRateRebate") return [];
    var rooms = promoRoomsInScope(promo);
    var combos = [];
    if (promo.subType === "rates") {
      (promo.ratesSourceTerms || []).forEach(function (t) { rooms.forEach(function (r) { combos.push(r + "|" + t); }); });
    } else if (promo.subType === "discount" || promo.subType === "rentFree") {
      (promo.discountTermIndices || []).forEach(function (t) { rooms.forEach(function (r) { combos.push(r + "|" + t); }); });
    } else if (promo.subType === "override") {
      rooms.forEach(function (r) {
        var overrides = (promo.roomOverrides && promo.roomOverrides[r]) || [];
        overrides.forEach(function (v, t) { if (v !== null && v !== undefined && v !== "") combos.push(r + "|" + t); });
      });
    }
    return combos;
  }

  function promoDateSpan(promo) {
    return { start: promo.startDate || "0000-01-01", end: promo.endDate || "9999-12-31" };
  }
  function promoDatesOverlap(a, b) { return a.start <= b.end && b.start <= a.end; }

  // Returns a conflict message (matching the spec's exact wording) if
  // promo, as it currently stands, would control a (room, term) combo
  // that another Weekly Rate Rebate promo on the same card already
  // controls during an overlapping date range - or null if there's no
  // conflict. Called after every relevant field edit, not just at
  // creation, per HANDOVER.md §3.6 - the caller is responsible for
  // reverting the edit if this returns non-null.
  function findPromoConflict(card, promo) {
    var myCombos = touchedCombos(promo);
    if (!myCombos.length) return null;
    var mySpan = promoDateSpan(promo);
    var others = (card.promotions.list || []).filter(function (p) { return p.id !== promo.id && p.fieldType === "weeklyRateRebate"; });
    for (var i = 0; i < others.length; i++) {
      var other = others[i];
      if (!promoDatesOverlap(mySpan, promoDateSpan(other))) continue;
      var otherCombos = touchedCombos(other);
      for (var j = 0; j < myCombos.length; j++) {
        if (otherCombos.indexOf(myCombos[j]) !== -1) {
          var parts = myCombos[j].split("|");
          var termLabel = (card.columns[Number(parts[1])] || {}).label || ("Term " + parts[1]);
          return "Unable to Create. " + termLabel + " " + parts[0] + " Rate is already being applied in promo name: " + other.name;
        }
      }
    }
    return null;
  }

  // =====================================================================
  // Calculation engine (HANDOVER.md §3) - must be bit-for-bit reproduced.
  // Pure functions, no DOM/state access, so they're independently testable.
  // =====================================================================

  function parseISODateUTC(iso) { return new Date(iso + "T00:00:00Z"); }
  function daysBetweenISO(aISO, bISO) { return Math.round((parseISODateUTC(bISO) - parseISODateUTC(aISO)) / 86400000); }

  // Adds calendar months; clamps to the target month's last day rather
  // than rolling into the following month (e.g. Jan 31 + 1 month = Feb 28,
  // not Mar 3).
  function addMonthsISO(dateISO, m) {
    var d = parseISODateUTC(dateISO);
    var day = d.getUTCDate();
    var totalMonth = d.getUTCMonth() + m;
    var year = d.getUTCFullYear() + Math.floor(totalMonth / 12);
    var month = ((totalMonth % 12) + 12) % 12;
    var daysInTargetMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
    var clampedDay = Math.min(day, daysInTargetMonth);
    return new Date(Date.UTC(year, month, clampedDay)).toISOString().slice(0, 10);
  }

  // Largest whole number of calendar months addable to start without
  // passing end. Incremental rather than a closed-form calendar formula,
  // deliberately - addMonthsISO's own month-length clamping has to be the
  // thing that decides this, or the two could disagree at a month
  // boundary. Capped at 1200 (100 years) as a sanity guard.
  function wholeMonthsBetweenISO(startISO, endISO) {
    if (endISO < startISO) return 0;
    var m = 0;
    while (m < 1200 && addMonthsISO(startISO, m + 1) <= endISO) m++;
    return m;
  }

  // The exact remainder-distribution rule: prorating across a FULL period
  // (nights === fullPeriodNights) must reproduce rate exactly, cent for
  // cent, regardless of how the division rounds.
  function prorate(rate, fullPeriodNights, nights) {
    var floorRate = Math.floor(rate / fullPeriodNights);
    var remainder = rate - floorRate * fullPeriodNights;
    var ceilCount = Math.min(remainder, nights);
    var floorCount = nights - ceilCount;
    return { amount: ceilCount * (floorRate + 1) + floorCount * floorRate };
  }

  function calcMonthly(startISO, endISO, rate) {
    var months = wholeMonthsBetweenISO(startISO, endISO);
    var monthMark = addMonthsISO(startISO, months);
    var remainderNights = daysBetweenISO(monthMark, endISO);
    var periodAmount = rate * months;
    var nightAmount = remainderNights > 0 ? prorate(rate, 30, remainderNights).amount : 0;
    return { total: periodAmount + nightAmount, periods: months, periodAmount: periodAmount, nights: remainderNights, nightAmount: nightAmount };
  }

  function calcWeekly(startISO, endISO, rate) {
    var totalNights = daysBetweenISO(startISO, endISO);
    var weeks = Math.floor(totalNights / 7);
    var remainderNights = totalNights % 7;
    var periodAmount = rate * weeks;
    var nightAmount = remainderNights > 0 ? prorate(rate, 7, remainderNights).amount : 0;
    return { total: periodAmount + nightAmount, periods: weeks, periodAmount: periodAmount, nights: remainderNights, nightAmount: nightAmount };
  }

  function calcByRateType(rateType, startISO, endISO, rate) {
    return rateType === "Weekly" ? calcWeekly(startISO, endISO, rate) : calcMonthly(startISO, endISO, rate);
  }

  // Which rate card a check-in date resolves to - HANDOVER.md §3.2 exactly.
  function findRateCardForCheckIn(list, checkInISO) {
    var withRules = list.filter(function (rc) { return rc.availability && rc.availability.rules && rc.availability.rules.length > 0; });
    if (!withRules.length) return list[0];
    for (var i = 0; i < withRules.length; i++) {
      var rc = withRules[i];
      var matches = rc.availability.rules.some(function (r) { return expandRule(r).indexOf(checkInISO) !== -1; });
      if (matches) return rc;
    }
    var catchAll = list.filter(function (rc) { return !rc.availability || !rc.availability.rules || !rc.availability.rules.length; })[0];
    return catchAll || list[0];
  }

  function matchedColIdx(card, totalNights) {
    return card.columns.findIndex(function (c) {
      return totalNights >= (c.minNights == null ? 0 : c.minNights) && totalNights <= (c.maxNights == null ? Infinity : c.maxNights);
    });
  }

  function promoActiveForDate(promo, dateISO) {
    var span = promoDateSpan(promo);
    return dateISO >= span.start && dateISO <= span.end;
  }
  function promoAppliesTo(promo, roomName) {
    return promoRoomsInScope(promo).indexOf(roomName) !== -1;
  }

  // First-match-wins scan for the Weekly Rate Rebate's rate and utilities
  // slots (HANDOVER.md §3.5) - independent scans (a "discount" promo can
  // win both, or two different promos can each win one). rentFree
  // deliberately does not participate here - it's a lump-sum deduction
  // handled separately (§3.8), never baked into effectiveRateVal.
  function resolveRateRebateEffective(card, roomName, termIdx, checkInISO, roomPrices) {
    var rateVal = null, rateWinner = null, utilVal = null, utilWinner = null;
    var promos = (card.promotions.list || []).filter(function (p) {
      return p.fieldType === "weeklyRateRebate" && p.subType !== "rentFree" && promoActiveForDate(p, checkInISO) && promoAppliesTo(p, roomName);
    });
    for (var i = 0; i < promos.length; i++) {
      var p = promos[i];
      if (rateVal === null) {
        if (p.subType === "rates" && (p.ratesSourceTerms || []).indexOf(termIdx) !== -1) {
          rateVal = roomPrices[p.ratesTargetTerm]; rateWinner = p.name;
        } else if (p.subType === "discount" && (p.discountTermIndices || []).indexOf(termIdx) !== -1) {
          rateVal = roomPrices[termIdx] - (p.discountAmount || 0); rateWinner = p.name;
        } else if (p.subType === "override") {
          var ov = (p.roomOverrides && p.roomOverrides[roomName]) || [];
          if (ov[termIdx] != null) { rateVal = ov[termIdx]; rateWinner = p.name; }
        }
      }
      if (utilVal === null && p.subType === "discount" && (p.discountTermIndices || []).indexOf(termIdx) !== -1 && (p.utilitiesDiscountAmount || 0) > 0) {
        utilVal = p.utilitiesDiscountAmount; utilWinner = p.name;
      }
      if (rateVal !== null && utilVal !== null) break;
    }
    return { rateVal: rateVal, rateWinner: rateWinner, utilVal: utilVal, utilWinner: utilWinner };
  }

  // Rent Free (§3.8) - lump sum off the ORIGINAL (pre-rebate) rate/
  // utilities. Unlike §3.5's rate rebate, every active one applies
  // (summed), not just the first match.
  function collectRentFreeEntries(card, roomName, termIdx, checkInISO, originalRate, cardUtilities) {
    return (card.promotions.list || []).filter(function (p) {
      return p.fieldType === "weeklyRateRebate" && p.subType === "rentFree" && promoActiveForDate(p, checkInISO) &&
        promoAppliesTo(p, roomName) && (p.discountTermIndices || []).indexOf(termIdx) !== -1;
    }).map(function (p) {
      return {
        name: p.name,
        ratePeriods: p.discountAmount || 0, utilPeriods: p.utilitiesDiscountAmount || 0,
        rateAmount: originalRate * (p.discountAmount || 0), utilAmount: cardUtilities * (p.utilitiesDiscountAmount || 0)
      };
    });
  }

  // Promotion Period (§3.7) - per-term lump sum with optional Mid/End
  // split. Every active one applies (not a single-winner model).
  function collectPromotionPeriodEntries(card, roomName, colIdx, checkInISO, checkInVal, checkOutVal, totalNights) {
    return (card.promotions.list || []).filter(function (p) {
      return p.fieldType === "promotionPeriod" && promoActiveForDate(p, checkInISO) && promoAppliesTo(p, roomName);
    }).map(function (p) {
      var amt = p.amounts[colIdx] || 0;
      var pct = p.midLeasePercents[colIdx] || 0;
      var midAmt = Math.round(amt * pct / 100);
      var endAmt = amt - midAmt;
      return {
        name: p.name, amt: amt, pct: pct, midAmt: midAmt, endAmt: endAmt,
        midDate: addDaysISO(checkInVal, Math.floor(totalNights / 2)),
        endDate: addDaysISO(checkOutVal, -28)
      };
    });
  }

  function collectAddOnEntries(card, roomName, checkInISO) {
    return (card.promotions.list || []).filter(function (p) {
      return p.fieldType === "addOn" && promoActiveForDate(p, checkInISO) && promoAppliesTo(p, roomName);
    }).map(function (p) { return { name: p.name, text: p.addOnText }; }).filter(function (e) { return e.text; });
  }

  // Assembles one full booking calculation (§3.4, §3.10). Returns
  // { error } on any validation failure instead of throwing, so the UI can
  // show it plainly.
  function computeBooking(list, roomName, checkInISO, checkOutISO, propertyRateType) {
    if (!checkInISO || !checkOutISO) return { error: "Pick both a check-in and check-out date." };
    if (checkOutISO <= checkInISO) return { error: "Check-out must be after check-in." };
    if (!list || !list.length) return { error: "No rate cards configured." };

    var card = findRateCardForCheckIn(list, checkInISO);
    var totalNights = daysBetweenISO(checkInISO, checkOutISO);
    var colIdx = matchedColIdx(card, totalNights);
    if (colIdx === -1) return { error: "No lease term is set up for a " + totalNights + "-night stay." };

    var row = (card.rows || []).filter(function (r) { return r.name === roomName; })[0];
    if (!row) return { error: "Room type not found on the resolved rate card (" + (card.name || "Untitled") + ")." };

    var originalRate = row.prices[colIdx] || 0;
    var cardUtilities = card.utilities || 0;

    var rebate = resolveRateRebateEffective(card, roomName, colIdx, checkInISO, row.prices);
    var effectiveRateVal = rebate.rateVal !== null ? rebate.rateVal : originalRate;
    var effectiveUtilitiesPerPeriod = Math.max(0, cardUtilities - (rebate.utilVal !== null ? rebate.utilVal : 0));

    var grossRentResult = calcByRateType(propertyRateType, checkInISO, checkOutISO, originalRate);
    var rentResult = calcByRateType(propertyRateType, checkInISO, checkOutISO, effectiveRateVal);
    var grossUtilitiesResult = cardUtilities > 0 ? calcByRateType(propertyRateType, checkInISO, checkOutISO, cardUtilities) : null;
    var utilitiesResult = effectiveUtilitiesPerPeriod > 0 ? calcByRateType(propertyRateType, checkInISO, checkOutISO, effectiveUtilitiesPerPeriod) : null;

    var preDeductionTotal = rentResult.total + (utilitiesResult ? utilitiesResult.total : 0);

    var rentFreeEntries = collectRentFreeEntries(card, roomName, colIdx, checkInISO, originalRate, cardUtilities);
    var promoPeriodEntries = collectPromotionPeriodEntries(card, roomName, colIdx, checkInISO, checkInISO, checkOutISO, totalNights);
    var addOnEntries = collectAddOnEntries(card, roomName, checkInISO);

    var promoDeduction = rentFreeEntries.reduce(function (sum, e) { return sum + e.rateAmount + e.utilAmount; }, 0) +
      promoPeriodEntries.reduce(function (sum, e) { return sum + e.midAmt + e.endAmt; }, 0);

    var finalTotal = Math.max(0, preDeductionTotal - promoDeduction);

    return {
      card: card, colIdx: colIdx, termLabel: card.columns[colIdx].label, totalNights: totalNights,
      checkIn: checkInISO, checkOut: checkOutISO, roomName: roomName,
      originalRate: originalRate, cardUtilities: cardUtilities,
      effectiveRateVal: effectiveRateVal, effectiveUtilitiesPerPeriod: effectiveUtilitiesPerPeriod,
      rateWinner: rebate.rateWinner, utilWinner: rebate.utilWinner,
      grossRentResult: grossRentResult, rentResult: rentResult,
      grossUtilitiesResult: grossUtilitiesResult, utilitiesResult: utilitiesResult,
      rentFreeEntries: rentFreeEntries, promoPeriodEntries: promoPeriodEntries, addOnEntries: addOnEntries,
      preDeductionTotal: preDeductionTotal, promoDeduction: promoDeduction, finalTotal: finalTotal
    };
  }

  // Deposit / Bond / Advance Rent (§3.11) - multipliers of the POST-rebate
  // rate, never the gross rate.
  function computePayableToday(effectiveRateVal, property, finalTotal) {
    var deposit = effectiveRateVal * (property.securityDeposit || 0);
    var bond = effectiveRateVal * (property.bond || 0);
    var advance = effectiveRateVal * (property.advanceRent || 0);
    // Stamp Duty is a % of the whole lease's total cost (finalTotal, the
    // "Total lease amount" figure above this section) - not a multiple of
    // the per-period rate like the other three - rounded UP to the
    // nearest whole currency unit, per how Jeremy specified the example
    // (2.5% of $13,239 = $330.975, shown as $331).
    var stampDuty = property.stampDutyEnabled ? Math.ceil((finalTotal || 0) * ((property.stampDutyPercent || 0) / 100)) : 0;
    return { deposit: deposit, bond: bond, advance: advance, stampDuty: stampDuty, total: advance + bond + deposit + stampDuty };
  }

  // ---- Calculator page (HANDOVER.md §2.4) - matches the Lease Rate
  // Simulator artifact's own design and text-generation exactly. ----
  function formatMoney(amount, currency) {
    var symbol = CURRENCIES[currency] || "";
    var n = amount || 0;
    return symbol + n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  // Check-in options (§2.4): a free date picker if NO card has any
  // Check-in rules at all; otherwise a select populated with the union of
  // every card's Check-in rules, expanded to concrete dates. Returns null
  // to signal "use a free date picker".
  function allCheckInOptions(list) {
    var hasAnyRules = list.some(function (rc) { return rc.availability && rc.availability.rules && rc.availability.rules.length > 0; });
    if (!hasAnyRules) return null;
    var seen = {};
    list.forEach(function (rc) {
      (rc.availability.rules || []).forEach(function (r) { expandRule(r).forEach(function (d) { seen[d] = true; }); });
    });
    return Object.keys(seen).sort();
  }

  // Check-out options for the specific resolved card, constrained to (a)
  // that card's own Check-out rules and (b) strictly after check-in - so
  // "before check-in" is structurally unselectable. Returns null to
  // signal "use a free date picker" (still bounded by a min= attribute).
  function checkOutOptionsForCard(card, checkInVal) {
    var rules = (card.checkOutAvailability && card.checkOutAvailability.rules) || [];
    if (!rules.length) return null;
    var seen = {};
    rules.forEach(function (r) { expandRule(r).forEach(function (d) { if (d > checkInVal) seen[d] = true; }); });
    return Object.keys(seen).sort();
  }

  // Union of every rate card's own Check-out rules, not scoped to whichever
  // one card the selected Check-in date happens to resolve to - used by the
  // Agent view, where End date is meant to be a straightforward dropdown of
  // every valid check-out date across the property, not tied to a specific
  // card the way the Calculator page's check-out (which computes one
  // specific room's price against one specific card) needs to be. Optionally
  // filtered to strictly-after a given check-in value. Returns null (never
  // an empty array) when no card has any Check-out rules at all, so the
  // caller can fall back to a free date picker instead of an empty dropdown.
  function allCheckOutOptions(list, afterVal) {
    var hasAnyRules = list.some(function (rc) { return rc.checkOutAvailability && rc.checkOutAvailability.rules && rc.checkOutAvailability.rules.length > 0; });
    if (!hasAnyRules) return null;
    var seen = {};
    list.forEach(function (rc) {
      (rc.checkOutAvailability.rules || []).forEach(function (r) {
        expandRule(r).forEach(function (d) { if (!afterVal || d > afterVal) seen[d] = true; });
      });
    });
    return Object.keys(seen).sort();
  }

  function durationString(periods, nights, rateType) {
    var word = rateType === "Weekly" ? "week" : "month";
    var periodsStr = periods + " " + word + (periods === 1 ? "" : "s");
    return nights > 0 ? periodsStr + " + " + nights + " night" + (nights === 1 ? "" : "s") : periodsStr;
  }

  // ---- Lightbox (image/video carousel viewer) ----
  var lightboxItems = [];
  var lightboxIndex = 0;

  function ensureLightbox() {
    var modal = document.getElementById("lightboxModal");
    if (modal) return modal;
    modal = document.createElement("div");
    modal.id = "lightboxModal";
    modal.className = "lightbox-modal";
    modal.innerHTML =
      '<button class="lightbox-close" type="button" aria-label="Close">✕</button>' +
      '<button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous">‹</button>' +
      '<img class="lightbox-img" src="" alt="">' +
      '<div class="lightbox-video-file-wrap">' +
      '<div class="lightbox-video-caption lightbox-video-caption-file"></div>' +
      '<video class="lightbox-video-player" controls playsinline></video>' +
      '</div>' +
      '<div class="lightbox-video-wrap">' +
      '<div class="lightbox-video-caption"></div>' +
      '<div class="lightbox-video-placeholder"><span class="lightbox-video-icon">▶</span></div>' +
      '<a class="lightbox-open-link" href="#" target="_blank" rel="noopener">Open video ↗</a>' +
      '</div>' +
      '<button class="lightbox-nav lightbox-next" type="button" aria-label="Next">›</button>' +
      '<div class="lightbox-counter"></div>';
    document.body.appendChild(modal);

    modal.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
    modal.addEventListener("click", function (e) { if (e.target === modal) closeLightbox(); });
    modal.querySelector(".lightbox-prev").addEventListener("click", function () { showLightboxItem(-1); });
    modal.querySelector(".lightbox-next").addEventListener("click", function () { showLightboxItem(1); });

    var touchStartX = null;
    function onTouchStart(e) { touchStartX = e.touches[0].clientX; }
    function onTouchEnd(e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) showLightboxItem(dx < 0 ? 1 : -1);
      touchStartX = null;
    }
    modal.querySelector(".lightbox-img").addEventListener("touchstart", onTouchStart, { passive: true });
    modal.querySelector(".lightbox-img").addEventListener("touchend", onTouchEnd, { passive: true });
    modal.querySelector(".lightbox-video-wrap").addEventListener("touchstart", onTouchStart, { passive: true });
    modal.querySelector(".lightbox-video-wrap").addEventListener("touchend", onTouchEnd, { passive: true });

    document.addEventListener("keydown", function (e) {
      if (modal.style.display !== "flex") return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showLightboxItem(-1);
      if (e.key === "ArrowRight") showLightboxItem(1);
    });

    return modal;
  }

  function openLightbox(items, startIndex) {
    if (!items || !items.length) return;
    lightboxItems = items;
    lightboxIndex = startIndex;
    var modal = ensureLightbox();
    modal.style.display = "flex";
    updateLightboxContent();
  }

  function closeLightbox() {
    var modal = document.getElementById("lightboxModal");
    if (!modal) return;
    modal.style.display = "none";
    var player = modal.querySelector(".lightbox-video-player");
    player.pause();
    player.removeAttribute("src");
    player.load();
  }

  function showLightboxItem(delta) {
    lightboxIndex = (lightboxIndex + delta + lightboxItems.length) % lightboxItems.length;
    updateLightboxContent();
  }

  function updateLightboxContent() {
    var modal = document.getElementById("lightboxModal");
    if (!modal) return;
    var item = lightboxItems[lightboxIndex];
    var imgEl = modal.querySelector(".lightbox-img");
    var fileWrap = modal.querySelector(".lightbox-video-file-wrap");
    var player = modal.querySelector(".lightbox-video-player");
    var fileCaptionEl = modal.querySelector(".lightbox-video-caption-file");
    var videoWrap = modal.querySelector(".lightbox-video-wrap");
    var captionEl = modal.querySelector(".lightbox-video-caption");
    var openLink = modal.querySelector(".lightbox-open-link");

    player.pause();
    player.removeAttribute("src");
    player.load();

    imgEl.style.display = "none";
    fileWrap.style.display = "none";
    videoWrap.style.display = "none";

    if (item.type === "image") {
      imgEl.style.display = "block";
      imgEl.src = item.src;
    } else if (item.kind === "file") {
      fileWrap.style.display = "flex";
      fileCaptionEl.textContent = item.caption || "";
      fileCaptionEl.style.display = item.caption ? "block" : "none";
      player.src = "/api/rates-media?id=" + encodeURIComponent(item.assetId);
    } else {
      videoWrap.style.display = "flex";
      captionEl.textContent = item.caption || "";
      captionEl.style.display = item.caption ? "block" : "none";
      openLink.href = item.url;
    }

    modal.querySelector(".lightbox-counter").textContent = (lightboxIndex + 1) + " / " + lightboxItems.length;
    var multiple = lightboxItems.length > 1;
    modal.querySelector(".lightbox-prev").style.display = multiple ? "flex" : "none";
    modal.querySelector(".lightbox-next").style.display = multiple ? "flex" : "none";
  }

  function roomGalleryItems(roomName) {
    var media = (state.rates.property.roomMedia && state.rates.property.roomMedia[roomName]) || { images: [], videos: [] };
    var items = [];
    (media.images || []).forEach(function (id) { items.push({ type: "image", src: "/api/rates-media?id=" + encodeURIComponent(id) }); });
    (media.videos || []).forEach(function (v) {
      if (v.type === "link") items.push({ type: "video", kind: "link", url: v.url, caption: v.caption || "" });
      else items.push({ type: "video", kind: "file", assetId: v.assetId, caption: v.caption || "" });
    });
    return items;
  }

  function missingFieldsPrompt(calc, isCompare) {
    var missing = [];
    if (!calc.checkIn) missing.push("a check-in date");
    if (!calc.checkOut) missing.push("a check-out date");
    if (isCompare) { if (!calc.compareRoomType) missing.push("a room type to compare"); }
    else { if (!calc.roomType) missing.push("a room type"); }
    if (!missing.length) return "";
    var joined = missing.length === 1 ? missing[0] : (missing.slice(0, -1).join(", ") + " and " + missing[missing.length - 1]);
    return "Select " + joined + " to see pricing.";
  }

  function renderCalculatorPage() {
    var html = '<div class="shell">' + renderTopbar();
    if (state.loading) { html += '</div>'; return html; }

    var rates = state.rates;
    var list = (rates && rates.list) || [];
    var calc = state.calculator;

    if (!list.length) {
      html += '<div class="table-wrap"><div class="empty-state"><h2>No rate cards yet</h2>';
      html += '<p>Add a rate card in Setup > Rate Cards before calculating a lease price.</p></div></div></div>';
      return html;
    }

    // Guard against a stale selection after DISPLAY_TYPES itself changed
    // (e.g. the High/Low split was just turned on/off in Property
    // Information) - an option that no longer exists would otherwise just
    // silently vanish from the dropdown while the state still "remembers" it.
    if (calc.roomType && DISPLAY_TYPES.indexOf(calc.roomType) === -1) calc.roomType = "";
    if (calc.compareRoomType && DISPLAY_TYPES.indexOf(calc.compareRoomType) === -1) calc.compareRoomType = "";

    var checkInOptions = allCheckInOptions(list);
    // Default every selector to its first option on load, rather than
    // leaving all three blank and making someone pick before seeing
    // anything - same reasoning as Agent's own Start/End date defaults.
    if (!calc.checkIn && checkInOptions && checkInOptions.length) calc.checkIn = checkInOptions[0];
    var resolvedCard = calc.checkIn ? findRateCardForCheckIn(list, calc.checkIn) : null;
    var checkOutOptions = resolvedCard && calc.checkIn ? checkOutOptionsForCard(resolvedCard, calc.checkIn) : null;
    if (!calc.checkOut && checkOutOptions && checkOutOptions.length) calc.checkOut = checkOutOptions[0];
    if (!calc.roomType && DISPLAY_TYPES.length) calc.roomType = DISPLAY_TYPES[0];

    html += '<div class="calc-controls">';
    html += '<div class="calc-field"><label>Check-in date</label>';
    if (checkInOptions) {
      html += '<select id="calc-checkin"><option value="">Select…</option>';
      checkInOptions.forEach(function (d) { html += '<option value="' + d + '"' + (calc.checkIn === d ? " selected" : "") + '>' + formatDateDMY(d) + '</option>'; });
      html += '</select>';
    } else {
      html += '<input type="date" id="calc-checkin" value="' + escapeAttr(calc.checkIn) + '">';
    }
    html += '</div>';

    html += '<div class="calc-field"><label>Check-out date</label>';
    if (checkOutOptions) {
      html += '<select id="calc-checkout"' + (calc.checkIn ? "" : " disabled") + '><option value="">Select…</option>';
      checkOutOptions.forEach(function (d) { html += '<option value="' + d + '"' + (calc.checkOut === d ? " selected" : "") + '>' + formatDateDMY(d) + '</option>'; });
      html += '</select>';
    } else {
      html += '<input type="date" id="calc-checkout" value="' + escapeAttr(calc.checkOut) + '"' + (calc.checkIn ? ' min="' + escapeAttr(addDaysISO(calc.checkIn, 1)) + '"' : " disabled") + '>';
    }
    html += '</div>';

    html += '<div class="calc-field rate"><label>Room type</label><select id="calc-roomtype"><option value="">Select…</option>';
    DISPLAY_TYPES.forEach(function (name) { html += '<option value="' + escapeAttr(name) + '"' + (calc.roomType === name ? " selected" : "") + '>' + escapeHtml(name) + '</option>'; });
    html += '</select></div>';

    if (calc.compareEnabled) {
      html += '<div class="calc-field rate"><label>Compare room type</label><select id="calc-compare-roomtype"><option value="">Select…</option>';
      DISPLAY_TYPES.forEach(function (name) { html += '<option value="' + escapeAttr(name) + '"' + (calc.compareRoomType === name ? " selected" : "") + '>' + escapeHtml(name) + '</option>'; });
      html += '</select></div>';
    }

    html += '<button type="button" class="calc-pill-btn' + (calc.compareEnabled ? " active" : "") + '" id="calc-compare-toggle-btn">' + (calc.compareEnabled ? "✕ Remove comparison" : "+ Compare Rooms") + '</button>';
    html += '</div>';

    // Computed fresh on every render, straight from whatever's currently
    // selected - no separate "Calculate" step and nothing cached in state
    // to go stale. computeBooking is a pure function, cheap enough to call
    // on every keystroke's worth of re-render.
    var result = (calc.checkIn && calc.checkOut && calc.roomType) ? computeBooking(list, calc.roomType, calc.checkIn, calc.checkOut, rates.property.rateType) : null;
    var compareResult = (calc.compareEnabled && calc.checkIn && calc.checkOut && calc.compareRoomType) ? computeBooking(list, calc.compareRoomType, calc.checkIn, calc.checkOut, rates.property.rateType) : null;

    if ((result && result.error) || (compareResult && compareResult.error)) {
      html += '<div class="calc-err">' + escapeHtml((result && result.error) || (compareResult && compareResult.error)) + '</div>';
    }

    // Rate Card Summary + Promotions follow whichever card the selected
    // Check-in date actually resolves to - matching the calc card's own
    // pricing above it - rather than staying pinned to whichever card
    // happens to be selected in Setup. Falls back to the Setup-selected
    // card only when no Check-in has been chosen yet, so the panels still
    // show something reasonable before a date is picked.
    var activeCard = calc.checkIn ? findRateCardForCheckIn(list, calc.checkIn) : list[Math.min(rates.activeIndex || 0, list.length - 1)];
    html += '<div class="calc-grid single-mode' + (calc.compareEnabled ? " compare-mode" : "") + '">';
    html += (result && !result.error) ? buildCalcCardHtml(result, rates.property, calc.roomType) : '<div class="placeholder-panel in">' + escapeHtml(missingFieldsPrompt(calc, false)) + '</div>';
    if (calc.compareEnabled) {
      html += (compareResult && !compareResult.error) ? buildCalcCardHtml(compareResult, rates.property, calc.compareRoomType) : '<div class="placeholder-panel in">' + escapeHtml(missingFieldsPrompt(calc, true)) + '</div>';
    }
    html += '<div class="calc-right-col-stack">';
    html += renderRateCardSummaryPanel(activeCard, calc.compareEnabled);
    html += renderPromotionsPanel(activeCard);
    html += '</div>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function buildCalcCardHtml(result, property, roomTypeName) {
    var currency = property.currency;
    var isWeekly = property.rateType === "Weekly";
    var periodWordLower = isWeekly ? "week" : "month";
    var periodWordCap = isWeekly ? "Week" : "Month";
    var methodDesc = isWeekly
      ? "Full 7-night weeks priced at the weekly rate; remaining nights prorated over a fixed 7-night week."
      : "Full calendar months priced at the monthly rate; remaining nights prorated over a fixed 30-night month.";
    var rateLabel = isWeekly ? "Weekly rate" : "Monthly rate";
    var fmtSigned = function (n) { return (n < 0 ? "-" : "") + formatMoney(Math.abs(n), currency); };

    var html = '<div class="calc-card">';
    html += '<div class="head"><div class="idx">' + (isWeekly ? "WEEKLY" : "MONTHLY") + '</div>';
    html += '<h2>' + escapeHtml(roomTypeName) + '</h2>';
    html += '<div class="method">' + methodDesc + '</div></div>';

    html += '<div class="body">';
    html += '<div class="calc-rowline"><span class="k">Start date</span><span class="v">' + formatDateDMY(result.checkIn) + '</span></div>';
    html += '<div class="calc-rowline"><span class="k">End date</span><span class="v">' + formatDateDMY(result.checkOut) + '</span></div>';
    html += '<div class="calc-rowline"><span class="k">' + rateLabel + '</span><span class="v">' +
      (result.rateWinner ? '<span class="calc-rc-strike">' + formatMoney(result.originalRate, currency) + '</span> ' + formatMoney(result.effectiveRateVal, currency) : formatMoney(result.effectiveRateVal, currency)) +
      ' <span class="calc-lease-tag">(' + escapeHtml(result.termLabel) + ')</span></span></div>';
    if (result.cardUtilities > 0) {
      html += '<div class="calc-rowline"><span class="k">Utilities</span><span class="v">' +
        (result.utilWinner ? '<span class="calc-rc-strike">' + formatMoney(result.cardUtilities, currency) + '</span> ' + formatMoney(result.effectiveUtilitiesPerPeriod, currency) : formatMoney(result.effectiveUtilitiesPerPeriod, currency)) +
        ' <span class="calc-lease-tag">(per ' + periodWordLower + ')</span></span></div>';
    }

    if (result.addOnEntries.length) {
      html += '<div class="calc-addon-block"><div class="calc-addon-label">Add On</div><ul class="calc-addon-list">';
      result.addOnEntries.forEach(function (e) { html += '<li>' + escapeHtml(e.text) + '</li>'; });
      html += '</ul></div>';
    }

    var gallery = roomGalleryItems(roomTypeName);
    if (gallery.length) {
      html += '<div class="calc-gallery"><div class="calc-gallery-track">';
      gallery.forEach(function (it, i) {
        var videoCls = it.type === "video" ? " calc-gallery-thumb-video" : "";
        var content = it.type === "image" ? '<img src="' + escapeAttr(it.src) + '" alt="' + escapeAttr(roomTypeName) + ' photo">' : '<span class="calc-gallery-play-icon">▶</span>';
        html += '<button type="button" class="calc-gallery-thumb' + videoCls + '" data-gallery-room="' + escapeAttr(roomTypeName) + '" data-gallery-idx="' + i + '">' + content + '</button>';
      });
      html += '</div></div>';
    }

    html += '<div class="calc-duration"><div class="k">Lease duration</div><div class="v">' + durationString(result.rentResult.periods, result.rentResult.nights, property.rateType) + '</div></div>';

    // Workings - collapsed by default, matching the artifact's own toggle
    var workingsHtml = '<div class="calc-step-divider">Accommodations</div>';
    workingsHtml += '<div class="calc-step sub"><span>Rate (' + result.grossRentResult.periods + ' ' + periodWordCap + (result.grossRentResult.periods === 1 ? "" : "s") + ' @ ' + formatMoney(result.originalRate, currency) + '/' + periodWordLower + ')</span><span class="v">' + formatMoney(result.grossRentResult.periodAmount, currency) + '</span></div>';
    if (result.grossRentResult.nights > 0) {
      workingsHtml += '<div class="calc-step sub"><span>Rate (' + result.grossRentResult.nights + ' Night' + (result.grossRentResult.nights === 1 ? "" : "s") + ' @ ' + formatMoney(result.grossRentResult.nightAmount / result.grossRentResult.nights, currency) + '/Night)</span><span class="v">' + formatMoney(result.grossRentResult.nightAmount, currency) + '</span></div>';
    }
    if (result.rateWinner) {
      var periodDelta = result.rentResult.periodAmount - result.grossRentResult.periodAmount;
      var nightDelta = result.rentResult.nightAmount - result.grossRentResult.nightAmount;
      if (periodDelta !== 0 || nightDelta !== 0) {
        workingsHtml += '<div class="calc-step-divider">' + escapeHtml(result.rateWinner) + ' (Rate Change)</div>';
        if (periodDelta !== 0) {
          var perPeriodDelta = result.effectiveRateVal - result.originalRate;
          workingsHtml += '<div class="calc-step sub"><span>Rate (' + result.rentResult.periods + ' ' + periodWordCap + (result.rentResult.periods === 1 ? "" : "s") + ' @ ' + perPeriodDelta + '/' + periodWordLower + ')</span><span class="v">' + fmtSigned(periodDelta) + '</span></div>';
        }
        if (result.rentResult.nights > 0 && nightDelta !== 0) {
          var perNightDelta = Math.round(nightDelta / result.rentResult.nights);
          workingsHtml += '<div class="calc-step sub"><span>Rate (' + result.rentResult.nights + ' Night' + (result.rentResult.nights === 1 ? "" : "s") + ' @ ' + perNightDelta + '/Night)</span><span class="v">' + fmtSigned(nightDelta) + '</span></div>';
        }
      }
    }
    if (result.grossUtilitiesResult) {
      workingsHtml += '<div class="calc-step-divider">Utilities</div>';
      workingsHtml += '<div class="calc-step sub"><span>Utilities (' + result.grossUtilitiesResult.periods + ' ' + periodWordCap + (result.grossUtilitiesResult.periods === 1 ? "" : "s") + ' @ ' + formatMoney(result.cardUtilities, currency) + '/' + periodWordLower + ')</span><span class="v">' + formatMoney(result.grossUtilitiesResult.periodAmount, currency) + '</span></div>';
      if (result.grossUtilitiesResult.nights > 0) {
        workingsHtml += '<div class="calc-step sub"><span>Utilities (' + result.grossUtilitiesResult.nights + ' Night' + (result.grossUtilitiesResult.nights === 1 ? "" : "s") + ' @ ' + formatMoney(result.grossUtilitiesResult.nightAmount / result.grossUtilitiesResult.nights, currency) + '/Night)</span><span class="v">' + formatMoney(result.grossUtilitiesResult.nightAmount, currency) + '</span></div>';
      }
      if (result.utilWinner && result.utilitiesResult) {
        var utilPeriodDelta = result.utilitiesResult.periodAmount - result.grossUtilitiesResult.periodAmount;
        var utilNightDelta = result.utilitiesResult.nightAmount - result.grossUtilitiesResult.nightAmount;
        if (utilPeriodDelta !== 0 || utilNightDelta !== 0) {
          workingsHtml += '<div class="calc-step-divider">' + escapeHtml(result.utilWinner) + ' (Utilities Change)</div>';
          if (utilPeriodDelta !== 0) {
            var perPeriodUtilDelta = result.effectiveUtilitiesPerPeriod - result.cardUtilities;
            workingsHtml += '<div class="calc-step sub"><span>Utilities (' + result.utilitiesResult.periods + ' ' + periodWordCap + (result.utilitiesResult.periods === 1 ? "" : "s") + ' @ ' + perPeriodUtilDelta + '/' + periodWordLower + ')</span><span class="v">' + fmtSigned(utilPeriodDelta) + '</span></div>';
          }
          if (result.utilitiesResult.nights > 0 && utilNightDelta !== 0) {
            var perNightUtilDelta = Math.round(utilNightDelta / result.utilitiesResult.nights);
            workingsHtml += '<div class="calc-step sub"><span>Utilities (' + result.utilitiesResult.nights + ' Night' + (result.utilitiesResult.nights === 1 ? "" : "s") + ' @ ' + perNightUtilDelta + '/Night)</span><span class="v">' + fmtSigned(utilNightDelta) + '</span></div>';
          }
        }
      }
    }
    if (result.promoPeriodEntries.length || result.rentFreeEntries.length) {
      workingsHtml += '<div class="calc-step-divider">Rebate</div>';
      result.promoPeriodEntries.forEach(function (e) {
        if (e.midAmt > 0) workingsHtml += '<div class="calc-step sub"><span>' + escapeHtml(e.name) + ' (Mid Lease · ' + formatDateDMY(e.midDate) + ')</span><span class="v">-' + formatMoney(e.midAmt, currency) + '</span></div>';
        if (e.endAmt > 0) workingsHtml += '<div class="calc-step sub"><span>' + escapeHtml(e.name) + ' (End Lease · ' + formatDateDMY(e.endDate) + ')</span><span class="v">-' + formatMoney(e.endAmt, currency) + '</span></div>';
      });
      result.rentFreeEntries.forEach(function (e) {
        var sub = [];
        if (e.rateAmount > 0) sub.push({ k: "Rate (" + e.ratePeriods + " " + periodWordLower + (e.ratePeriods === 1 ? "" : "s") + " free @ " + formatMoney(result.originalRate, currency) + "/" + periodWordLower + ")", v: "-" + formatMoney(e.rateAmount, currency) });
        if (e.utilAmount > 0) sub.push({ k: "Utilities (" + e.utilPeriods + " " + periodWordLower + (e.utilPeriods === 1 ? "" : "s") + " free @ " + formatMoney(result.cardUtilities, currency) + "/" + periodWordLower + ")", v: "-" + formatMoney(e.utilAmount, currency) });
        if (!sub.length) return;
        workingsHtml += '<div class="calc-step sub"><span>' + escapeHtml(e.name) + ' (Rent Free)</span><span class="v">-' + formatMoney(e.rateAmount + e.utilAmount, currency) + '</span></div>';
        sub.forEach(function (s) { workingsHtml += '<div class="calc-step subsub"><span>' + s.k + '</span><span class="v">' + s.v + '</span></div>'; });
      });
    }

    html += '<div class="calc-breakdown"><button class="calc-breakdown-toggle" type="button" aria-expanded="false"><span>Price Breakdown</span><span class="calc-chevron">▾</span></button>';
    html += '<div class="calc-breakdown-content" hidden>' + workingsHtml + '</div></div>';
    html += '</div>'; // .body

    var payable = computePayableToday(result.effectiveRateVal, property, result.finalTotal);
    var depositUnits = property.securityDeposit || 0, advanceUnits = property.advanceRent || 0, bondUnits = property.bond || 0;
    var periodWordTag = isWeekly ? "week" : "month";
    html += '<div class="calc-total"><div class="calc-total-head"><div class="k">Total lease amount</div><button class="calc-info-btn" type="button" aria-expanded="false" title="Total Payable Today">?</button></div>';
    html += '<div class="v">' + formatMoney(result.finalTotal, currency) + '</div>';
    html += '<div class="calc-total-extra" hidden>';
    html += '<div class="calc-payable-today-row"><span class="calc-payable-today-label">Total Payable Today</span><span class="calc-payable-today-value">' + formatMoney(payable.total, currency) + '</span></div>';
    if (payable.advance > 0) html += '<div class="calc-step"><span>Advance Rent (' + advanceUnits + ' ' + periodWordTag + (advanceUnits === 1 ? "" : "s") + ')</span><span class="v">' + formatMoney(payable.advance, currency) + '</span></div>';
    if (payable.bond > 0) html += '<div class="calc-step"><span>Bond (' + bondUnits + ' ' + periodWordTag + (bondUnits === 1 ? "" : "s") + ')</span><span class="v">' + formatMoney(payable.bond, currency) + '</span></div>';
    if (payable.deposit > 0) html += '<div class="calc-step"><span>Security Deposit (' + depositUnits + ' ' + periodWordTag + (depositUnits === 1 ? "" : "s") + ')</span><span class="v">' + formatMoney(payable.deposit, currency) + '</span></div>';
    if (payable.stampDuty > 0) html += '<div class="calc-step"><span>Stamp Duty (' + numOrEmpty(property.stampDutyPercent) + '%)</span><span class="v">' + formatMoney(payable.stampDuty, currency) + '</span></div>';
    html += '</div></div>'; // .calc-total-extra, .calc-total

    html += '</div>'; // .calc-card
    return html;
  }

  var PROMO_TYPE_LABELS = { weeklyRateRebate: "Weekly Rate Rebate", promotionPeriod: "Promotion Period", addOn: "Add Ons" };

  function formatPromoDateRange(startDate, endDate) {
    if (!startDate && !endDate) return "Always active";
    if (!startDate) return "Until " + formatDateDMY(endDate);
    if (!endDate) return "From " + formatDateDMY(startDate);
    return formatDateDMY(startDate) + " – " + formatDateDMY(endDate);
  }

  function formatPromoValue(card, promo) {
    var rooms = (promo.roomTypeNames && promo.roomTypeNames.length) ? promo.roomTypeNames.join(", ") : "All room types";
    if (promo.fieldType === "addOn") {
      return escapeHtml(promo.addOnText || "(no text)") + " — " + escapeHtml(rooms);
    }
    if (promo.fieldType === "promotionPeriod") {
      if (!card.columns.length) return "(no lease terms yet)";
      var parts = card.columns.map(function (c, ci) {
        var amt = Number((promo.amounts && promo.amounts[ci]) || 0);
        if (amt <= 0) return null;
        var midPct = Number((promo.midLeasePercents && promo.midLeasePercents[ci]) || 0);
        var split = midPct > 0 ? (midPct + "% Mid Lease, " + (100 - midPct) + "% End Lease") : "100% End Lease";
        return escapeHtml(c.label || "Lease Term") + ": " + formatMoney(amt, state.rates.property.currency) + " (" + split + ")";
      }).filter(Boolean);
      return (parts.length ? parts.join(" · ") : "(no rebate amounts set)") + " — " + escapeHtml(rooms);
    }
    // weeklyRateRebate
    if (!card.columns.length) return "(no lease terms yet)";
    var currency = state.rates.property.currency;
    if (promo.subType === "rates") {
      var srcLabel = (promo.ratesSourceTerms && promo.ratesSourceTerms.length) ? promo.ratesSourceTerms.map(function (ci) { return (card.columns[ci] || {}).label || "Lease Term"; }).join(", ") : "(not set)";
      var tgtLabel = promo.ratesTargetTerm != null ? ((card.columns[promo.ratesTargetTerm] || {}).label || "Lease Term") : "(not set)";
      return "Replace " + escapeHtml(srcLabel) + " rate with " + escapeHtml(tgtLabel) + " rate — " + escapeHtml(rooms);
    }
    if (promo.subType === "discount") {
      var terms = (promo.discountTermIndices || []).map(function (ci) { return (card.columns[ci] || {}).label || "Lease Term"; }).join(", ") || "(no lease terms selected)";
      var rateBit = Number(promo.discountAmount) > 0 ? "-" + formatMoney(Number(promo.discountAmount), currency) + " rate" : null;
      var utilBit = Number(promo.utilitiesDiscountAmount) > 0 ? "-" + formatMoney(Number(promo.utilitiesDiscountAmount), currency) + " utilities" : null;
      var bits = [rateBit, utilBit].filter(Boolean).join(", ") || "no discount set";
      return bits + " off " + escapeHtml(terms) + " — " + escapeHtml(rooms);
    }
    if (promo.subType === "rentFree") {
      var rfTerms = (promo.discountTermIndices || []).map(function (ci) { return (card.columns[ci] || {}).label || "Lease Term"; }).join(", ") || "(no lease terms selected)";
      var periodWord = state.rates.property.rateType === "Weekly" ? "weeks" : "months";
      var rateFreeBit = Number(promo.discountAmount) > 0 ? (promo.discountAmount + " " + periodWord + " rate free") : null;
      var utilFreeBit = Number(promo.utilitiesDiscountAmount) > 0 ? (promo.utilitiesDiscountAmount + " " + periodWord + " utilities free") : null;
      var freeBits = [rateFreeBit, utilFreeBit].filter(Boolean).join(", ") || "no free periods set";
      return freeBits + " on " + escapeHtml(rfTerms) + " — " + escapeHtml(rooms);
    }
    // override
    var overrideParts = (promo.roomTypeNames || []).map(function (name) {
      var overrides = promo.roomOverrides && promo.roomOverrides[name];
      if (!overrides) return null;
      var vals = card.columns.map(function (c, ci) {
        return (overrides[ci] === null || overrides[ci] === undefined) ? null : (escapeHtml(c.label || "Lease Term") + ": " + formatMoney(Number(overrides[ci]) || 0, currency));
      }).filter(Boolean).join(", ");
      return vals ? (escapeHtml(name) + " — " + vals) : null;
    }).filter(Boolean);
    return overrideParts.length ? overrideParts.join(" · ") : "(select room type(s) and set override rates)";
  }

  function renderRateCardSummaryPanel(card, useShortNames) {
    var html = '<div class="calc-rc-panel"><div class="calc-rc-head"><h3>' + escapeHtml(card.name && card.name.trim() ? card.name : "Rate Card") + '</h3></div><div class="calc-rc-body">';
    if (!card.rows.length || !card.columns.length) {
      html += '<div class="calc-rc-empty">No room types yet.</div>';
    } else {
      var today = todayISO();
      html += '<table class="calc-rc-table"><thead><tr><th>Room Type</th>';
      card.columns.forEach(function (c) { html += '<th>' + escapeHtml(c.label || "Lease Term") + '</th>'; });
      html += '</tr></thead><tbody>';
      card.rows.forEach(function (rt) {
        var displayName = useShortNames && state.rates.property.roomShortNames && state.rates.property.roomShortNames[rt.name]
          ? state.rates.property.roomShortNames[rt.name] : rt.name;
        html += '<tr><td>' + escapeHtml(displayName) + '</td>';
        card.columns.forEach(function (c, ci) {
          var original = Number(rt.prices[ci]) || 0;
          var rebate = resolveRateRebateEffective(card, rt.name, ci, today, rt.prices);
          if (rebate.rateVal !== null && rebate.rateVal !== original) {
            html += '<td><span class="calc-rc-strike">' + formatMoney(original, state.rates.property.currency) + '</span> ' + formatMoney(rebate.rateVal, state.rates.property.currency) + '</td>';
          } else {
            html += '<td>' + formatMoney(original, state.rates.property.currency) + '</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div></div>';
    return html;
  }

  function renderPromotionsPanel(card) {
    var html = '<div class="calc-rc-panel"><div class="calc-rc-head"><h3>Promotions</h3></div><div class="calc-rc-body">';
    var list = (card && card.promotions && card.promotions.list) || [];
    if (!list.length) {
      html += '<div class="calc-rc-empty">No promotions yet.</div>';
    } else {
      list.forEach(function (promo) {
        html += '<div class="calc-promo-card"><div class="calc-promo-card-top">';
        html += '<span class="calc-promo-name">' + escapeHtml(promo.name || "Untitled promotion") + '</span>';
        html += '<span class="calc-promo-type-badge">' + PROMO_TYPE_LABELS[promo.fieldType] + '</span></div>';
        html += '<div class="calc-promo-value">' + formatPromoValue(card, promo) + '</div>';
        html += '<div class="calc-promo-daterange">' + formatPromoDateRange(promo.startDate, promo.endDate) + '</div></div>';
      });
    }
    html += '</div></div>';
    return html;
  }

  // Content copied word for word from the reference artifact's own help
  // popover - same title, same descriptions, same bullet wording.
  function renderPromoInfoPopover() {
    var html = '<div class="promo-info-popover" id="promo-info-popover">';
    html += '<div class="promo-info-title">Promotion types</div>';
    html += '<div class="promo-info-block"><div class="promo-info-type">Weekly Rate Rebate</div>';
    html += '<div class="promo-info-desc">Changes what a room\'s rate and/or utilities actually are for a lease term.</div>';
    html += '<ul class="promo-info-list">';
    html += '<li><b>Rates</b> — copies one lease term\'s rate onto one or more other terms (e.g. give Short-Term the Full-Year price).</li>';
    html += '<li><b>Discount</b> — a flat $ amount off the rate and/or utilities, recurring every period, for the selected lease term(s).</li>';
    html += '<li><b>Override</b> — manually replace a room\'s rate for specific lease terms with an exact new number.</li>';
    html += '<li><b>Rent Free</b> — a number of periods (weeks/months) of rate and/or utilities given free, as a one-time lump sum off the total — not baked into the per-period rate.</li>';
    html += '</ul></div>';
    html += '<div class="promo-info-block"><div class="promo-info-type">Promotion Period</div>';
    html += '<div class="promo-info-desc">A one-time rebate amount, set per lease term, optionally split between Mid Lease and End Lease.</div>';
    html += '<ul class="promo-info-list"><li><b>Mid Lease</b> = Halfway through the stay by nights.</li><li><b>End Lease</b> = 28 days before check-out.</li></ul></div>';
    html += '<div class="promo-info-block"><div class="promo-info-type">Add Ons</div>';
    html += '<div class="promo-info-desc">Non-monetary perks (free items or services) listed on the calculation — don\'t affect any amount.</div></div>';
    html += '</div>';
    return html;
  }

  function renderSetupPromotionsTab() {
    if (!state.rates) return '<div class="console-body"></div>';
    if (!BASE_TYPES.length) return syncRequiredNotice();
    var list = state.rates.list || [];
    var html = renderRateCardPillRow(list, state.rates.activeIndex);

    if (!list.length) {
      html += '<div class="console-body"><p style="color:var(--ink-soft);font-size:13.5px;margin:0">No rate cards yet — add one in Rate Cards first.</p></div>';
      return html;
    }

    var idx = clampActiveCardIndex(list);
    var card = list[idx];
    var promos = (card.promotions && card.promotions.list) || [];

    html += '<div class="console-body">';
    html += '<div class="promo-header-row"><div class="console-section-label" style="margin:0">Promotions</div>';
    html += '<div class="promo-info-wrap"><button type="button" class="promo-info-btn" id="promo-info-btn" title="What are the promotion types?">?</button>';
    if (state.promoInfoOpen) html += renderPromoInfoPopover();
    html += '</div></div>';
    html += '<div class="promo-add-row">';
    html += '<button type="button" class="btn-ghost" data-add-promo="weeklyRateRebate">+ Weekly Rate Rebate</button>';
    html += '<button type="button" class="btn-ghost" data-add-promo="promotionPeriod">+ Promotion Period</button>';
    html += '<button type="button" class="btn-ghost" data-add-promo="addOn">+ Add On</button>';
    html += '</div>';

    if (!promos.length) {
      html += '<p style="color:var(--ink-faint);font-size:12.5px;margin:10px 0 0">No promotions on this rate card yet.</p>';
    }

    promos.forEach(function (promo, pIdx) {
      html += renderPromoBlock(card, promo, pIdx);
    });

    html += '</div>';
    html += renderSaveBar();
    return html;

  var FIELD_TYPE_LABELS = { weeklyRateRebate: "Weekly Rate Rebate", promotionPeriod: "Promotion Period", addOn: "Add On" };
  var SUBTYPE_LABELS = { rates: "Rates", discount: "Discount", override: "Override", rentFree: "Rent Free" };

  function renderPromoBlock(card, promo, pIdx) {
    var html = '<div class="promo-block" data-promo-index="' + pIdx + '">';
    html += '<div class="promo-header">';
    html += '<div class="promo-scope-field"><label>Type</label><select class="rc-select-input" data-promo-field="fieldType" data-promo-index="' + pIdx + '">';

  function allKnownFloors() {
