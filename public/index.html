  // Geometry helpers for editing an existing shape: distance from a point
  // to a line segment (for "is this click close enough to an edge to
  // insert a point there"), and which edge (if any) a click landed near.
  // Plain Euclidean distance in the 0-100 percentage space - not pixel-
  // perfect for a very non-square image, but close enough for a
  // click-tolerance check, and simple.
  function pointToSegmentDistance(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.sqrt(Math.pow(p.x - a.x, 2) + Math.pow(p.y - a.y, 2));
    var t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    var projX = a.x + t * dx, projY = a.y + t * dy;
    return Math.sqrt(Math.pow(p.x - projX, 2) + Math.pow(p.y - projY, 2));
  }

  // Index of the edge (points[i] -> points[i+1], wrapping around) closest
  // to p, within tolerance - a new point inserted on this edge goes at
  // index i+1. Returns -1 when nothing is close enough (click was
  // elsewhere in the shape's interior, meaning "drag the whole shape"
  // instead).
  function nearestEdgeIndex(points, p, tolerance) {
    var best = -1, bestDist = tolerance;
    for (var i = 0; i < points.length; i++) {
      var a = points[i], b = points[(i + 1) % points.length];
      var d = pointToSegmentDistance(p, a, b);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    return best;
  }

  // The sibling floors (as strings, excluding this one) that share the
  // exact same physical layout - i.e. whatever floorplan-image.js recorded
  // when an image was last uploaded to more than one floor at once. Used
  // only to show a hint here; the actual propagation happens server-side
  // in floorplan.js whenever a shape is saved with a changedKey.
  function siblingFloorsOf(floor) {
    var group = state.floorplan.floorGroups[String(floor)];
    if (!Array.isArray(group)) return [];
    return group.map(String).filter(function (f) { return f !== String(floor); });
  }

  function renderFeHotspotSvg(floor, fe) {
    var hotspots = state.floorplan.hotspots[String(floor)] || {};
    var svg = '<svg class="fp-hotspot-svg" id="fe-svg" viewBox="0 0 100 100" preserveAspectRatio="none">';
    // While actively tracing a new shape, hide every other already-mapped
    // hotspot entirely - not just the one being redrawn - so the image
    // stays clean to click points on instead of being cluttered with
    // everything already placed.
    if (!fe.activeKey) {
      for (var key in hotspots) {
        var points = hotspots[key].points || [];
        if (points.length < 3) continue;
        var isFacility = key.indexOf("facility:") === 0;
        var pointsAttr = points.map(function (p) { return p.x + "," + p.y; }).join(" ");
        // vector-effect keeps the outline a true, fixed screen-pixel width
        // (the CSS stroke-width value) regardless of how large the image
        // itself is rendered - without it, "thickness" is really a
        // percentage of image width (this viewBox is 0-100), which reads
        // as far too thick on anything but a tiny image.
        svg += '<polygon class="fp-hotspot-poly' + (isFacility ? " facility" : "") + '" points="' + pointsAttr + '" vector-effect="non-scaling-stroke"></polygon>';
      }
    }
    var pointMarkers = "";
    if (fe.activeKey && fe.drawingPoints.length) {
      var dPointsAttr = fe.drawingPoints.map(function (p) { return p.x + "," + p.y; }).join(" ");
      // In edit mode the polygon itself is interactive (click near an edge
      // to insert a point there, drag its interior to move the whole
      // shape) - id'd so bindEvents can attach real listeners to it, not
      // just the plain click-to-append-a-point behavior used while
      // tracing a brand-new shape.
      svg += '<polygon class="fp-hotspot-poly spotlight" id="' + (fe.editMode ? "fe-edit-polygon" : "") + '" points="' + dPointsAttr + '" vector-effect="non-scaling-stroke"' + (fe.editMode ? ' style="pointer-events:auto;cursor:move"' : '') + '></polygon>';
      // Plain HTML dots, not SVG circles: an SVG circle's radius is a
      // shape coordinate in the 0-100 viewBox, so it scales up with the
      // image exactly like the old stroke-width problem did - there's no
      // non-scaling-stroke equivalent for a filled shape's own geometry.
      // A small fixed-size, absolutely-positioned dot is the only way to
      // keep it visually small and constant regardless of image size.
      // In edit mode each one is also a real draggable handle
      // (data-point-index identifies which point it moves).
      fe.drawingPoints.forEach(function (p, i) {
        var cls = "fp-point-marker" + (fe.editMode ? " fp-edit-handle" : "");
        pointMarkers += '<span class="' + cls + '" style="left:' + p.x + '%;top:' + p.y + '%"' + (fe.editMode ? ' data-point-index="' + i + '"' : '') + '></span>';
      });
    }
    svg += '</svg>';
    return svg + pointMarkers;
  }

  // Downscales an image client-side before it ever gets base64-encoded
  // and sent to the server. Floor plan photos straight off a phone camera
  // can be several megabytes at full resolution - base64 inflates that by
  // roughly a third again, and that request body can exceed a payload
  // limit somewhere along the way (a local dev server's own limit, or
  // Netlify Functions' 6MB request limit in production) well before the
  // image itself was ever too big to be useful for tracing hotspots on.
  // Only ever shrinks (never upscales a smaller image), and re-encodes as
  // JPEG for better compression on photographic content - floor plan
  // images don't rely on transparency, so this trade-off is safe here.
  function resizeImageForUpload(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var outW = Math.max(1, Math.round(w * scale)), outH = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = outW; canvas.height = outH;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, outW, outH);
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error("Could not process image")); return; }
          var reader = new FileReader();
          reader.onload = function () {
            var base64 = String(reader.result).split(",")[1];
            resolve({ base64: base64, contentType: "image/jpeg" });
          };
          reader.onerror = function () { reject(reader.error || new Error("File read failed")); };
          reader.readAsDataURL(blob);
        }, "image/jpeg", quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Could not load the selected file as an image")); };
      img.src = url;
    });
  }

  function readFileAsBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result; // "data:<type>;base64,<data>"
        var m = /^data:([^;]+);base64,(.*)$/s.exec(result);
        if (!m) { reject(new Error("Could not read file")); return; }
        resolve({ base64: m[2], contentType: m[1] });
      };
      reader.onerror = function () { reject(reader.error || new Error("File read failed")); };
      reader.readAsDataURL(file);
    });
  }
  function uploadRateMediaAsset(base64, contentType) {
    return api("/api/rates-media", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ imageBase64: base64, contentType: contentType }) })
      .then(function (res) { if (!res.ok) throw new Error((res.body && res.body.error) || "Upload failed"); return res.body.id; });
  }

  // Shared by both places a room row's click handler lives (the main
  // render and the search-input's own surgical table-only redraw, kept
  // separate purely so typing in the search box doesn't lose focus on
  // every keystroke) - having the max-5 rule in exactly one place means
  // the two can never drift apart on this behavior the way duplicated
  // logic risks doing. At most 5 rooms stay expanded at once; expanding a
  // 6th closes whichever one was expanded longest ago, not just the
  // "first" in whatever order they happen to be listed.
  function toggleRoomExpanded(name) {
    var rf = state.reservation;
    if (rf.expanded[name]) {
      delete rf.expanded[name];
      var idx = rf.expandedOrder.indexOf(name);
      if (idx !== -1) rf.expandedOrder.splice(idx, 1);
      return;
    }
    rf.expanded[name] = true;
    rf.expandedOrder.push(name);
    if (rf.expandedOrder.length > 5) {
      var oldest = rf.expandedOrder.shift();
      delete rf.expanded[oldest];
    }
  }

        api("/api/users", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(function (res) {
          if (res.ok) {
            ut.users = res.body.users || ut.users;

            ut.actionError = (res.body && res.body.error) || "Failed to add user.";

            if (res.ok) { ut.users = res.body.users || ut.users; } else { ut.actionError = (res.body && res.body.error) || "Failed to update user."; }

        btn.addEventListener("click", function () {

            if (res.ok) { ut.users = res.body.users || ut.users; } else { ut.actionError = (res.body && res.body.error) || "Failed to delete user."; }

    var unitConflictBtn = document.getElementById("unit-conflict-btn");

    var mismatchBtn = document.getElementById("mismatch-btn");

    var backBtn = document.getElementById("back-btn");

    var setupTabBtns = document.querySelectorAll("[data-setup-tab]");
    setupTabBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.setupTab = btn.getAttribute("data-setup-tab");
        if (state.setupTab === "users") loadUsersIfNeeded();
        render();
      });
    });

    // ---- Room Information tab ----
    function roomMediaEntry(name) {
      var prop = state.rates.property;
      if (!prop.roomMedia) prop.roomMedia = {};
      if (!prop.roomMedia[name]) prop.roomMedia[name] = { images: [], videos: [] };
      return prop.roomMedia[name];
    }

    document.querySelectorAll("[data-shortname-for]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var name = inp.getAttribute("data-shortname-for");
        if (!state.rates.property.roomShortNames) state.rates.property.roomShortNames = {};
        state.rates.property.roomShortNames[name] = inp.value.slice(0, 20);
        autoSaveRates();
      });
    });

    document.querySelectorAll("[data-trigger-file]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = document.getElementById(btn.getAttribute("data-trigger-file"));
        if (target) target.click();
      });
    });

    document.querySelectorAll("[data-upload-images-for]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var name = inp.getAttribute("data-upload-images-for");
        var files = Array.prototype.slice.call(inp.files || []);
        if (!files.length) return;
        Promise.all(files.map(function (file) {
          return readFileAsBase64(file).then(function (r) { return uploadRateMediaAsset(r.base64, r.contentType); });
        })).then(function (assetIds) {
          var entry = roomMediaEntry(name);
          assetIds.forEach(function (id) { entry.images.push(id); });
          render();
          autoSaveRates();
        }).catch(function (err) {
          state.testResult = { ok: false, text: "Image upload failed: " + err.message };
          render();
        });
      });
    });

    document.querySelectorAll("[data-upload-video-for]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var name = inp.getAttribute("data-upload-video-for");
        var file = inp.files && inp.files[0];
        if (!file) return;
        readFileAsBase64(file).then(function (r) { return uploadRateMediaAsset(r.base64, r.contentType); })
          .then(function (assetId) {
            roomMediaEntry(name).videos.push({ type: "file", assetId: assetId, caption: "", name: file.name, size: file.size });
            render();
            autoSaveRates();
          }).catch(function (err) {
            state.testResult = { ok: false, text: "Video upload failed: " + err.message };
            render();
          });
      });
    });

    document.querySelectorAll("[data-add-video-link]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-add-video-link");
        var urlInput = document.getElementById(btn.getAttribute("data-url-input"));
        var url = urlInput ? urlInput.value.trim() : "";
        if (!url) return;
        roomMediaEntry(name).videos.push({ type: "link", url: url, caption: "" });
        render();
        autoSaveRates();
      });
    });

    document.querySelectorAll("[data-remove-image]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-remove-image");
        var idx = Number(btn.getAttribute("data-image-index"));
        roomMediaEntry(name).images.splice(idx, 1);
        render();
        autoSaveRates();
      });
    });

    document.querySelectorAll("[data-remove-video]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-remove-video");
        var idx = Number(btn.getAttribute("data-video-index"));
        roomMediaEntry(name).videos.splice(idx, 1);
        render();
        autoSaveRates();
      });
    });

    document.querySelectorAll("[data-caption-for]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var name = inp.getAttribute("data-caption-for");
        var idx = Number(inp.getAttribute("data-video-index"));
        var entry = roomMediaEntry(name);
        if (entry.videos[idx]) entry.videos[idx].caption = inp.value;
        autoSaveRates();
      });
    });

    // ---- Rate Cards tab ----
    document.querySelectorAll("[data-select-card]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        if (e.target.hasAttribute("data-delete-card")) return; // the × has its own handler
        state.pendingDeleteCardId = null;
        state.pendingDeletePromoId = null;
        state.rates.activeIndex = Number(btn.getAttribute("data-select-card"));
        render();
      });
    });
    // Two-click confirm, in-page (no window.confirm dialog): first click
    // arms this specific card's × as "Confirm ×" (see renderRateCardPillRow);
    // a second click on it while armed actually deletes. Clicking anywhere
    // else, or a different card's ×, disarms it instead of deleting - see
    // the document-level click listener bound once in bindEvents' setup.
    document.querySelectorAll("[data-delete-card]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var idx = Number(btn.getAttribute("data-delete-card"));
        var card = state.rates.list[idx];
        if (state.pendingDeleteCardId !== card.id) {
          state.pendingDeleteCardId = card.id;
          render();
          return;
        }
        state.rates.list.splice(idx, 1);
        if (state.rates.activeIndex >= state.rates.list.length) state.rates.activeIndex = Math.max(0, state.rates.list.length - 1);
        state.pendingDeleteCardId = null;
        render();
        autoSaveRates();
      });
    });
    var addCardBtn = document.getElementById("rc-add-card-btn");
    if (addCardBtn) addCardBtn.addEventListener("click", function () {
      state.rates.list.push(newRateCard());
      state.rates.activeIndex = state.rates.list.length - 1;
      render();
      autoSaveRates();
    });

    var rcActiveCard = state.rates && state.rates.list && state.rates.list[state.rates.activeIndex];
    if (rcActiveCard) {
      var rcName = document.getElementById("rc-name");
      if (rcName) rcName.addEventListener("change", function () { rcActiveCard.name = rcName.value.slice(0, 30); render(); autoSaveRates(); });
      var rcUtilities = document.getElementById("rc-utilities");
      if (rcUtilities) rcUtilities.addEventListener("change", function () { rcActiveCard.utilities = parseFloat(rcUtilities.value) || 0; autoSaveRates(); });

      document.querySelectorAll("[data-term-label]").forEach(function (inp) {
        inp.addEventListener("change", function () { rcActiveCard.columns[Number(inp.getAttribute("data-term-label"))].label = inp.value.slice(0, 30); autoSaveRates(); });
      });
      document.querySelectorAll("[data-term-min]").forEach(function (inp) {
        inp.addEventListener("change", function () { rcActiveCard.columns[Number(inp.getAttribute("data-term-min"))].minNights = Number(inp.value) || 0; render(); autoSaveRates(); });
      });
      document.querySelectorAll("[data-term-max]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var col = rcActiveCard.columns[Number(inp.getAttribute("data-term-max"))];
          col.maxNights = inp.value === "" ? null : Number(inp.value);
          render();
          autoSaveRates();
        });
      });
      document.querySelectorAll("[data-row-index]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var rowIdx = Number(inp.getAttribute("data-row-index"));
          var priceIdx = Number(inp.getAttribute("data-price-index"));
          rcActiveCard.rows[rowIdx].prices[priceIdx] = parseFloat(inp.value) || 0;
          autoSaveRates();
        });
      });

      // Hot Room - stored per rate card (card.hotRooms), same as prices:
      // "YSMG 2026 Sem 2" and "YSMG 2027 Sem 1" can each mark completely
      // different room types as hot with different override quantities,
      // independent of each other. Agent reads from whichever card the
      // selected date actually resolves to, matching how its Weekly Rate
      // column already works.
      document.querySelectorAll("[data-hotroom-enabled]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var name = cb.getAttribute("data-hotroom-enabled");
          if (!rcActiveCard.hotRooms) rcActiveCard.hotRooms = {};
          if (!rcActiveCard.hotRooms[name]) rcActiveCard.hotRooms[name] = { enabled: false, quantity: null };
          rcActiveCard.hotRooms[name].enabled = cb.checked;
          render();
          autoSaveRates();
        });
      });
      document.querySelectorAll("[data-hotroom-qty]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var name = inp.getAttribute("data-hotroom-qty");
          if (!rcActiveCard.hotRooms) rcActiveCard.hotRooms = {};
          if (!rcActiveCard.hotRooms[name]) rcActiveCard.hotRooms[name] = { enabled: false, quantity: null };
          rcActiveCard.hotRooms[name].quantity = inp.value === "" ? null : Math.max(0, Math.round(Number(inp.value)));
          autoSaveRates();
        });
      });

      // End date filled in -> this becomes a range rule, so the weekday
      // selector becomes meaningful; blank end date -> single-date rule,
      // weekday doesn't apply.
      ["availability", "checkOutAvailability"].forEach(function (fieldKey) {
        var endInp = document.getElementById("av-end-" + fieldKey);
        var weekdaySel = document.getElementById("av-weekday-" + fieldKey);
        if (endInp && weekdaySel) {
          endInp.addEventListener("change", function () {
            weekdaySel.disabled = !endInp.value;
            if (!endInp.value) weekdaySel.value = "";
          });
        }
      });

      document.querySelectorAll("[data-add-rule]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var fieldKey = btn.getAttribute("data-add-rule");
          var isCheckIn = btn.getAttribute("data-checkin") === "1";
          var startInp = document.getElementById("av-start-" + fieldKey);
          var endInp = document.getElementById("av-end-" + fieldKey);
          var weekdaySel = document.getElementById("av-weekday-" + fieldKey);
          var startVal = startInp ? startInp.value : "";
          var endVal = endInp ? endInp.value : "";
          var weekdayVal = weekdaySel && !weekdaySel.disabled ? weekdaySel.value : "";
          if (!startVal) { window.alert("Start date is required."); return; }
          if (endVal && endVal < startVal) { window.alert("End date can't be before start date."); return; }

          var rule = { id: "rule_" + Math.random().toString(36).slice(2, 10), tier1: endVal ? "range" : "single", startDate: startVal, endDate: endVal || "", weekday: endVal ? weekdayVal : "" };
          if (isCheckIn && checkInOverlapsOtherCards(rule, rcActiveCard.id)) {
            window.alert("This date range overlaps a Check-in rule on another rate card. Adjust the dates so each rate card's Check-in window stays unambiguous.");
            return;
          }
          if (!rcActiveCard[fieldKey]) rcActiveCard[fieldKey] = { rules: [] };
          rcActiveCard[fieldKey].rules.push(rule);
          render();
          autoSaveRates();
        });
      });

      document.querySelectorAll("[data-remove-rule]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var fieldKey = btn.getAttribute("data-remove-rule");
          var idx = Number(btn.getAttribute("data-rule-index"));
          rcActiveCard[fieldKey].rules.splice(idx, 1);
          render();
          autoSaveRates();
        });
      });

      // ---- Promotions tab ----
      if (!rcActiveCard.promotions) rcActiveCard.promotions = { list: [] };

      document.querySelectorAll("[data-add-promo]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          rcActiveCard.promotions.list.unshift(newPromotion(btn.getAttribute("data-add-promo")));
          render();
          autoSaveRates();
        });
      });
      document.querySelectorAll("[data-remove-promo]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var idx = Number(btn.getAttribute("data-remove-promo"));
          var promo = rcActiveCard.promotions.list[idx];
          if (state.pendingDeletePromoId !== promo.id) {
            state.pendingDeletePromoId = promo.id;
            render();
            return;
          }
          rcActiveCard.promotions.list.splice(idx, 1);
          state.pendingDeletePromoId = null;
          render();
          autoSaveRates();
        });
      });

      // Re-checks the Weekly Rate Rebate conflict rule (HANDOVER.md §3.6)
      // after mutateFn has already applied the tentative change; reverts
      // via revertFn and alerts if it introduces a conflict. A no-op check
      // for non-weeklyRateRebate promos, since touchedCombos() only
      // returns anything for that fieldType. Only saves on the success
      // path - a reverted change has nothing new to save.
      function applyPromoChange(promo, mutateFn, revertFn) {
        mutateFn();
        var conflict = findPromoConflict(rcActiveCard, promo);
        if (conflict) {
          window.alert(conflict);
          revertFn();
          render();
          return;
        }
        render();
        autoSaveRates();
      }

      document.querySelectorAll("[data-promo-field]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var pIdx = Number(inp.getAttribute("data-promo-index"));
          var promo = rcActiveCard.promotions.list[pIdx];
          var field = inp.getAttribute("data-promo-field");
          var old = promo[field];
          var isDateField = field === "startDate" || field === "endDate";
          var newVal;
          if (field === "ratesTargetTerm") newVal = Number(inp.value);
          else if (field === "discountAmount" || field === "utilitiesDiscountAmount") newVal = parseFloat(inp.value) || 0;
          else if (field === "name") newVal = inp.value.slice(0, 60);
          else newVal = inp.value;

          if (isDateField) {
            applyPromoChange(promo, function () { promo[field] = newVal; }, function () { promo[field] = old; });
          } else {
            promo[field] = newVal;
            render();
            autoSaveRates();
          }
        });
      });

      document.querySelectorAll("[data-promo-room]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var pIdx = Number(btn.getAttribute("data-promo-room"));
          var roomName = btn.getAttribute("data-room-name");
          var promo = rcActiveCard.promotions.list[pIdx];
          if (!promo.roomTypeNames) promo.roomTypeNames = [];
          var old = promo.roomTypeNames.slice();
          applyPromoChange(promo, function () {
            var i = promo.roomTypeNames.indexOf(roomName);
            if (i === -1) promo.roomTypeNames.push(roomName);
            else promo.roomTypeNames.splice(i, 1);
          }, function () { promo.roomTypeNames = old; });
        });
      });

      document.querySelectorAll("[data-promo-term]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var pIdx = Number(cb.getAttribute("data-promo-term"));
          var termField = cb.getAttribute("data-term-field"); // "ratesSourceTerms" | "discountTermIndices"
          var promo = rcActiveCard.promotions.list[pIdx];
          if (!promo[termField]) promo[termField] = [];
          var old = promo[termField].slice();
          var termIdx = Number(cb.value);
          applyPromoChange(promo, function () {
            var i = promo[termField].indexOf(termIdx);
            if (cb.checked && i === -1) promo[termField].push(termIdx);
            else if (!cb.checked && i !== -1) promo[termField].splice(i, 1);
          }, function () { promo[termField] = old; });
        });
      });

      document.querySelectorAll("[data-override-room]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          var pIdx = Number(inp.getAttribute("data-promo-index"));
          var roomName = inp.getAttribute("data-override-room");
          var termIdx = Number(inp.getAttribute("data-override-term"));
          var promo = rcActiveCard.promotions.list[pIdx];
          if (!promo.roomOverrides) promo.roomOverrides = {};
          if (!promo.roomOverrides[roomName]) promo.roomOverrides[roomName] = [null, null, null];

      // Guards against a stale result overwriting a fresher one: if a

      // succeeded, without this the first attempt's late failure message

    // Percentage position (0-100, clamped) of a mouse or touch event
    // relative to the floor plan SVG - shared by every drag/click handler
    // below so they all agree on the same coordinate space the saved
    // points are stored in.
    function fpEventToPercent(svgEl, e) {
      var rect = svgEl.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100)),
        y: Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100))
      };
    }

    var feSvg = document.getElementById("fe-svg");
    // Plain "click anywhere to append a point" only applies while freely
    // tracing a brand-new shape - edit mode has its own, more deliberate
    // interactions below (drag a point, click an edge to insert, drag the
    // shape), which a point silently getting appended on every click
    // would conflict with.
    if (feSvg && fe.activeKey && !fe.editMode) {
      feSvg.addEventListener("click", function (e) {
        var p = fpEventToPercent(feSvg, e);
        fe.drawingPoints.push({ x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 });
        render();
      });
    }

    if (fe.editMode && feSvg) {
      // Dragging an individual point handle - a real mousedown/mousemove/
      // mouseup drag, updating the DOM directly on every move (not
      // render()) for smoothness, with a single render() only once the
      // drag actually ends, to pick up the final, saved-ready state.
      document.querySelectorAll(".fp-edit-handle").forEach(function (handle) {
        handle.addEventListener("mousedown", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var index = Number(handle.getAttribute("data-point-index"));
          function onMove(ev) {
            var p = fpEventToPercent(feSvg, ev);
            fe.drawingPoints[index] = { x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 };
            handle.style.left = p.x + "%";
            handle.style.top = p.y + "%";
            var poly = document.getElementById("fe-edit-polygon");
            if (poly) poly.setAttribute("points", fe.drawingPoints.map(function (pt) { return pt.x + "," + pt.y; }).join(" "));
          }
          function onUp() {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            render();
          }
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      });

      var editPolygon = document.getElementById("fe-edit-polygon");
      if (editPolygon) {
        // A real drag starting on the polygon body moves the whole shape;
        // a plain click (negligible movement between mousedown and
        // mouseup) close to an edge inserts a new point there instead -
        // distinguished by how far the mouse actually travels, not by
        // where on the shape the click landed.
        editPolygon.addEventListener("mousedown", function (e) {
          e.preventDefault();
          var startP = fpEventToPercent(feSvg, e);
          var origPoints = fe.drawingPoints.map(function (p) { return { x: p.x, y: p.y }; });
          var moved = false;
          function onMove(ev) {
            var p = fpEventToPercent(feSvg, ev);
            var dx = p.x - startP.x, dy = p.y - startP.y;
            if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) moved = true;
            if (!moved) return;
            fe.drawingPoints = origPoints.map(function (pt) {
              return { x: Math.round(Math.max(0, Math.min(100, pt.x + dx)) * 100) / 100, y: Math.round(Math.max(0, Math.min(100, pt.y + dy)) * 100) / 100 };
            });
            editPolygon.setAttribute("points", fe.drawingPoints.map(function (pt) { return pt.x + "," + pt.y; }).join(" "));
            document.querySelectorAll(".fp-edit-handle").forEach(function (h) {
              var idx = Number(h.getAttribute("data-point-index"));
              h.style.left = fe.drawingPoints[idx].x + "%";
              h.style.top = fe.drawingPoints[idx].y + "%";
            });
          }
          function onUp() {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            if (moved) { render(); return; }
            var edgeIdx = nearestEdgeIndex(fe.drawingPoints, startP, 2.5);
            if (edgeIdx !== -1) {
              fe.drawingPoints.splice(edgeIdx + 1, 0, { x: Math.round(startP.x * 100) / 100, y: Math.round(startP.y * 100) / 100 });
              render();
            }
          }
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      }
    }

    var editBtn = document.getElementById("fe-edit-btn");
    if (editBtn) editBtn.addEventListener("click", function () { fe.editMode = true; fe.saveMsg = null; render(); });

    var copyBtn = document.getElementById("fe-copy-btn");
    if (copyBtn) copyBtn.addEventListener("click", function () {
      var floorHotspots = state.floorplan.hotspots[String(fe.floor)] || {};
      var currentShape = floorHotspots[fe.activeKey];
      if (!currentShape) return;
      var points = currentShape.points;

      // Copies the shape's points and opens the target room in edit mode
      // for adjustment - never auto-saves. "Finish shape" is what commits
      // it, exactly like any other edit.
      function openForEdit(targetFloor, roomName) {
        fe.floor = targetFloor;
        fe.activeKey = roomName;
        fe.drawingPoints = points.map(function (p) { return { x: p.x, y: p.y }; });
        fe.editMode = true;
        fe.saveMsg = null;
        render();
      }

      var roomsHereNow = roomsOnFloor(fe.floor);
      var hotspotsHereNow = state.floorplan.hotspots[String(fe.floor)] || {};
      var unmappedHere = roomsHereNow.filter(function (r) { return r.name !== fe.activeKey && !hotspotsHereNow[r.name]; });
      if (unmappedHere.length) { openForEdit(fe.floor, unmappedHere[0].name); return; }

      // Nothing left unmapped on this floor - ask which floor to continue
      // on, then defer to the first unmapped room there.
      var input = window.prompt("Every room on this floor is already mapped. Enter a floor number to copy this shape to:");
      if (input === null) return;
      var targetFloor = Number(String(input).trim());
      if (!targetFloor && targetFloor !== 0) { window.alert("That's not a valid floor number."); return; }
      var targetRooms = roomsOnFloor(targetFloor);
      if (!targetRooms.length) { window.alert("No synced rooms found on floor " + targetFloor + "."); return; }
      var targetHotspots = state.floorplan.hotspots[String(targetFloor)] || {};
      var targetUnmapped = targetRooms.filter(function (r) { return !targetHotspots[r.name]; });
      if (!targetUnmapped.length) { window.alert("Every room on floor " + targetFloor + " is already mapped."); return; }
      openForEdit(targetFloor, targetUnmapped[0].name);
    });

    var clearBtn = document.getElementById("fe-clear-btn");
    if (clearBtn) clearBtn.addEventListener("click", function () { fe.drawingPoints = []; fe.editMode = false; render(); });

    var finishBtn = document.getElementById("fe-finish-btn");
    if (finishBtn) finishBtn.addEventListener("click", function () {
      var floorHotspots = Object.assign({}, state.floorplan.hotspots[String(fe.floor)] || {});
      floorHotspots[fe.activeKey] = { points: fe.drawingPoints };
      var savedKey = fe.activeKey;
      var savedFloor = fe.floor;
      api("/api/floorplan", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "saveHotspots", floor: savedFloor, hotspots: floorHotspots, changedKey: savedKey })
      }).then(function (res) {
        if (res.ok) {
          // Replace the whole hotspots object, not just this floor's entry -
          // a save here may have also updated sibling floors server-side.
          state.floorplan.hotspots = res.body.hotspots || state.floorplan.hotspots;
          var siblings = siblingFloorsOf(savedFloor);
          fe.saveMsg = { ok: true, text: siblings.length ? "Shape saved — also applied to floor(s) " + siblings.join(", ") + "." : "Shape saved." };
          fe.activeKey = null; fe.drawingPoints = []; fe.editMode = false;
        } else {
          fe.saveMsg = { ok: false, text: (res.body && res.body.error) || "Save failed." };
        }
        render();
      }).catch(function () { fe.saveMsg = { ok: false, text: "Save failed - network error." }; render(); });
    });

    var addFacilityBtn = document.getElementById("fe-add-facility-btn");
    if (addFacilityBtn) addFacilityBtn.addEventListener("click", function () {
      var input = document.getElementById("fe-new-facility");
      var name = (input.value || "").trim();
      if (!name) return;
      api("/api/floorplan", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "saveFacility", name: name, scope: "global" })
      }).then(function (res) {
        if (res.ok) { state.floorplan.facilities = res.body.facilities; fe.newFacilityName = ""; }
        render();
      });
    });

    var deleteFacilityBtns = document.querySelectorAll("[data-delete-facility]");
    deleteFacilityBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-delete-facility");
        if (!confirm("Delete this facility? This removes it from every floor it's mapped on.")) return;
        api("/api/floorplan", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "deleteFacility", id: id })
        }).then(function (res) {
          if (res.ok) state.floorplan.facilities = res.body.facilities;
          render();
        });
      });
    });
  }

  // The search box re-renders on every keystroke; re-rendering the whole
  // page (including re-creating the input) would steal focus, so this just
  // swaps the table body's rows instead of calling the full render().
  function renderReservationTableOnly() {
    var rf = state.reservation;
    var allRows = withDisplayType(state.rooms, floorConfig());
    var rows = filterAndSortRows(allRows, rf);
    var tbody = document.querySelector(".res-table tbody");
    if (!tbody) return;
    var html = "";
    if (!rows.length) {
      html = '<tr><td colspan="6" style="text-align:center;color:var(--ink-faint);padding:32px">No rooms match these filters.</td></tr>';
    } else {
      rows.forEach(function (x) {
        var r = x.room, expanded = !!rf.expanded[r.name];
        html += '<tr class="res-row" data-room="' + escapeAttr(r.name) + '">';
        html += '<td class="expand-col"><button class="expand-btn' + (expanded ? " open" : "") + '" data-toggle="' + escapeAttr(r.name) + '">' + icon("chevron") + '</button></td>';
        html += '<td class="rtype-name">' + escapeHtml(r.name || "—") + '</td>';
        html += '<td>' + escapeHtml(x.displayType) + '</td>';
        html += '<td><span class="status-pill status-' + escapeAttr(r.status) + '">' + statusLabel(r.status) + '</span></td>';
        html += '<td>' + escapeHtml(r.availableUntil || "—") + '</td>';
        html += '<td>' + escapeHtml(r.unavailableUntil || "—") + '</td>';
        html += '</tr>';
        if (expanded) {
          html += '<tr class="res-detail-row"><td></td><td colspan="5">' + roomDetailHtml(r) + '</td></tr>';
        }
      });
    }
    tbody.innerHTML = html;
    var resRows = tbody.querySelectorAll(".res-row");
    resRows.forEach(function (row) {
      row.addEventListener("click", function () {
        var name = row.getAttribute("data-room");
        toggleRoomExpanded(name);
        render();
      });
    });
  }

  // Startup: a saved session from a previous visit is only ever a
  // starting guess - it could have expired or been logged out from
  // elsewhere since - so it's always re-validated against the server
  // (via "me") before trusting it, rather than assuming it's still good
  // and loading the whole app on a token that might immediately 401.
  var restored = restoreSession();
  if (restored) {
    state.auth = restored;
    api("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "me" }) }).then(function (res) {
      if (res.ok) {
        loadAll();
      } else {
        clearSession();
        render();
      }
    }).catch(function () { clearSession(); render(); });
  } else {
    render();
  }
})();
</script>
</body>
</html>
