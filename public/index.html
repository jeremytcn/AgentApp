  // Light is this app's default (:root, no data-theme, matches how most
  // people first land here); dark applies when data-theme="dark" is set
  // explicitly, or - with no explicit override at all - when the
  // person's own system is set to dark (see the CSS's own
  // prefers-color-scheme rule). Reading the CURRENT state has to account
  // for all three, not just the attribute, since "system says dark, no
  // override yet" is a real state the toggle needs to know about too.
  function currentTheme() {
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr === "light" || attr === "dark") return attr;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }

  // ---- Reservation view helpers ----
  function statusLabel(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : "—"; }

  var MONTH_ABBR = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function formatDateDMY(iso) {
    if (!iso) return null;
    var parts = String(iso).slice(0, 10).split("-");
    if (parts.length !== 3) return iso;
    var y = parts[0], m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (!m || !d || m < 1 || m > 12) return iso;
    return (d < 10 ? "0" + d : d) + " " + MONTH_ABBR[m - 1] + " " + y;
  }

  function reservationStats(rooms) {
    var today = todayISO();
    var in7 = addDaysISO(today, 7);
    var total = rooms.length, availableNow = 0;
    var arrivingToday = 0, arrivingWithin7 = 0, departingToday = 0, departingWithin7 = 0;
    rooms.forEach(function (r) {
      if (r.status === "available") availableNow += 1;
      if (r.leaseStart === today) arrivingToday += 1;
      if (r.leaseStart && r.leaseStart >= today && r.leaseStart <= in7) arrivingWithin7 += 1;
      if (r.leaseEnd === today) departingToday += 1;
      if (r.leaseEnd && r.leaseEnd >= today && r.leaseEnd <= in7) departingWithin7 += 1;
    });
    var occupancyRate = total ? Math.round((total - availableNow) / total * 100) : 0;
    return {
      total: total, availableNow: availableNow, occupancyRate: occupancyRate,
      arrivingToday: arrivingToday, arrivingWithin7: arrivingWithin7,
      departingToday: departingToday, departingWithin7: departingWithin7
    };
  }

  // Every room, with its display type resolved once (including unmapped /
  // unclassified rooms, labeled rather than dropped - this view is meant to
  // show every synced room, unlike the Agent view's aggregate table).
  function withDisplayType(rooms, floorConfig) {
    return rooms.map(function (r) {
      var resolved = resolveDisplayType(r, floorConfig, BASE_TYPES, TIER_PRESENCE);
      var displayType = resolved.displayType ||
        (resolved.kind === "unmapped" ? (resolved.base || "(missing type)") + " (unmapped)" : (resolved.base || "(unknown)") + " (unclassified floor)");
      return { room: r, displayType: displayType };
    });
  }

  function allDisplayTypeOptions(rows) {
    var seen = {};
    rows.forEach(function (x) { seen[x.displayType] = true; });
    var ordered = DISPLAY_TYPES.filter(function (t) { return seen[t]; });
    var extras = Object.keys(seen).filter(function (t) { return DISPLAY_TYPES.indexOf(t) === -1; }).sort();
    return ordered.concat(extras);
  }

  function filterAndSortRows(rows, filters) {
    var q = (filters.search || "").trim().toLowerCase();
    var today = todayISO();
    var within7 = addDaysISO(today, 7);
    var filtered = rows.filter(function (x) {
      var r = x.room;
      if (filters.typeFilter && x.displayType !== filters.typeFilter) return false;
      if (filters.statusFilter && r.status !== filters.statusFilter) return false;
      if (q && (String(r.name || "") + " " + x.displayType).toLowerCase().indexOf(q) === -1) return false;
      if (filters.dateStart && filters.dateEnd && !isRoomAvailableForRange(r, filters.dateStart, filters.dateEnd)) return false;
      if (filters.quickFilter === "occupied" && r.status === "available") return false;
      if (filters.quickFilter === "arrivingToday" && !(r.leaseStart && r.leaseStart >= today && r.leaseStart <= within7)) return false;
      if (filters.quickFilter === "departingToday" && !(r.leaseEnd && r.leaseEnd >= today && r.leaseEnd <= within7)) return false;
      if (filters.quickFilter === "titleGenderMismatch" && !effectiveGender(r).mismatch) return false;
      if (filters.quickFilter === "unitGenderConflict" && UNIT_CONFLICT_ROOM_NAMES.indexOf(r.name) === -1) return false;
      return true;
    });

    var key = filters.sortKey, dir = filters.sortDir === "desc" ? -1 : 1;
    filtered.sort(function (a, b) {
      var av, bv;
      if (key === "roomType") { av = a.displayType; bv = b.displayType; }
      else if (key === "status") { av = a.room.status || ""; bv = b.room.status || ""; }
      else if (key === "availableUntil") { av = a.room.availableUntil || ""; bv = b.room.availableUntil || ""; }
      else if (key === "unavailableUntil") { av = a.room.unavailableUntil || ""; bv = b.room.unavailableUntil || ""; }
      else if (key === "leaseStart") { av = a.room.leaseStart || ""; bv = b.room.leaseStart || ""; }
      else if (key === "leaseEnd") { av = a.room.leaseEnd || ""; bv = b.room.leaseEnd || ""; }
      else { av = a.room.name || ""; bv = b.room.name || ""; }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    return filtered;
  }

  function sortArrow(key) {
    if (state.reservation.sortKey !== key) return "";
    return state.reservation.sortDir === "asc" ? " ▲" : " ▼";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(str) { return escapeHtml(str); }

  // For every numeric input in Setup: show it empty rather than pre-filled
  // with "0" when there's no real value yet, so an untouched field reads as
  // genuinely blank instead of looking like someone already typed a zero.
  // Every change handler already treats a blank input as 0 on the way back
  // in (parseFloat(v)||0 or Number(v)||0), so this is display-only.
  function numOrEmpty(v) {
    return (v === null || v === undefined || v === 0 || v === "0") ? "" : v;
  }

  function render() {
    var app = document.getElementById("app");
    if (!state.auth || !state.auth.token) {
      app.innerHTML = renderLoginPage();
      bindLoginEvents();
      return;
    }
    // Defense in depth beyond just hiding the nav tab: if the current
    // role can't see whatever view state.view happens to be (stale from
    // before a role change, or before logging out and back in as a
    // different role), fall back to a view that role can actually see,
    // rather than rendering a page whose data calls will all just 401 or
    // 403 anyway.
    var role = state.auth.role;
    if (role === "agent" && (state.view === "reservation" || state.view === "floorplan" || state.view === "setup")) {
      state.view = "agent";
    } else if (role === "internal" && state.view === "setup") {
      state.view = "agent";
    }
    if (state.rates && state.rates.property) {
      // Re-derive floor/shared/unitKey from the property's own Room Name
      // Conditioning config before anything downstream reads them (Hot
      // Room presence, tier splitting, Floor Plan grouping, etc. all
      // depend on these) - a no-op until that config is actually set.
      applyRoomNameConditioning(state.rooms, state.rates.property);
      var derivedShortName = deriveShortNameFromRooms(state.rooms, state.rates.property);
      if (derivedShortName != null) state.rates.property.shortName = derivedShortName;
    }
    BASE_TYPES = computeBaseTypes(state.rooms);
    if (state.rates && state.rates.property) {
      migratePropertyFloorConfig(state.rates.property);
      TIER_PRESENCE = computeTierPresence(state.rooms, state.rates.property);
      DISPLAY_TYPES = computeDisplayTypes(state.rates.property, BASE_TYPES, TIER_PRESENCE);
      UNIT_CONFLICT_ROOM_NAMES = computeUnitGenderConflicts(state.rooms, state.rates.property).roomNames;
    }
    if (state.view === "setup") {
      app.innerHTML = renderSetup();
    } else {
      var content;
      if (state.view === "floorplan") content = renderFloorPlan();
      else if (state.view === "reservation") content = renderReservation();
      else if (state.view === "calculator") content = renderCalculatorPage();
      else content = renderAgent();
      app.innerHTML = renderTopNav() + content;
    }
    bindEvents();
  }

  // One-time, best-effort: properties saved under the old 4-field
  // High/Low model (highFloorMin/Max, lowFloorMin/Max) get a highFloorFrom
  // derived from their old highFloorMin, so an existing real config (like
  // Jeremy's highFloorMin: 11) doesn't silently reset to "no split" the
  // next time this loads. Runs every render but is a no-op once
  // highFloorFrom is actually set - cheap, and safe to call repeatedly.
  function migratePropertyFloorConfig(property) {
    if (property.highFloorFrom == null && property.highFloorMin != null && Number(property.highFloorMin) > 0) {
      property.highFloorFrom = Number(property.highFloorMin);
    }
  }

  function topNavTab(view, label) {
    return '<button type="button" class="top-nav-tab' + (state.view === view ? " active" : "") + '" data-view="' + view + '">' + escapeHtml(label) + '</button>';
  }

  function renderTopNav() {
    var role = state.auth && state.auth.role;
    var html = '<div class="top-nav-wrap"><div class="top-nav">';
    html += topNavTab("agent", "Availability");
    // Agent role only ever gets Availability + Rates - Room List and
    // Floor Plan aren't part of that role's access at all, not just
    // hidden cosmetically (the backend still requires a session on every
    // read too, so this is consistent with what the API actually allows,
    // not just a UI nicety).
    if (role !== "agent") {
      html += topNavTab("reservation", "Room List");
    }
    html += topNavTab("calculator", "Rates");
    if (role !== "agent") {
      html += topNavTab("floorplan", "Floor Plan");
    }
    html += '</div></div>';
    return html;
  }

  function renderTopbar() {
    var connected = !!(state.connection && state.connection.jwtConfigured && state.connection.propertyId);
    var html = '<div class="topbar"><div><h1>' + escapeHtml(propertyName() || "Availability Simulator") + '</h1>';
    if (state.loading) {
      html += '<div class="conn-row"><span class="conn-pip"></span>Loading…</div>';
    } else if (connected) {
      html += '<div class="conn-row"><span class="conn-pip on"></span>Connected · synced ' + fmtAgo(state.syncedAt) + '</div>';
    } else {
      html += '<div class="conn-row"><span class="conn-pip off"></span>Not configured — set environment variables</div>';
    }
    html += '</div><div class="topbar-actions">';
    // Unit conflict / Mismatch only make sense as a "click to filter Room
    // List" shortcut, so they only ever show up ON Room List itself now -
    // showing them elsewhere just to jump to a different tab was more
    // confusing than useful once Sync rooms (the thing they used to sit
    // beside) moved into Setup Console.
    if (state.view === "reservation") {
      var unitConflict = computeUnitGenderConflicts(state.rooms, state.rates && state.rates.property);
      html += '<button class="btn-ghost" id="unit-conflict-btn"' + (unitConflict.count === 0 ? " disabled" : "") + ' title="Shared units where the bedrooms currently show different genders from each other - click to filter to just these rooms">' + unitConflict.count + ' Unit ⚠</button>';
      var mismatchCount = countTitleGenderMismatches(state.rooms);
      html += '<button class="btn-ghost" id="mismatch-btn"' + (mismatchCount === 0 ? " disabled" : "") + ' title="Rooms where Title and Gender disagree - click to filter to just these">' + mismatchCount + ' Mismatch</button>';
    }
    html += '<button class="icon-btn" id="theme-toggle-btn" title="Switch to ' + (currentTheme() === "dark" ? "light" : "dark") + ' mode">' + icon(currentTheme() === "dark" ? "sun" : "moon") + '</button>';
    if (state.auth && state.auth.role === "admin") {
      html += '<button class="icon-btn" id="gear-btn" title="Setup">' + icon("gear") + '</button>';
    }
    html += '<button class="btn-ghost" id="logout-btn" title="Log out">' + escapeHtml((state.auth && state.auth.username) || "") + ' · Log out</button>';
    html += '</div></div>';
    return html;
  }

  // Resolves what the rate column actually shows for one room type: the
  // card's price for the matched lease term, with a struck-through
  // original + effective price whenever a Weekly Rate Rebate promo wins
  // for this room and term - the exact same resolve-by-date logic the
  // Rates/Calculator page's own Rate Card Summary panel uses (see
  // renderRateCardSummaryPanel), just driven by Agent's own selected
  // Start date rather than always using today.
  function agentRoomRateHtml(card, name, colIdx, checkInVal, currency) {
    if (!card || colIdx == null || colIdx < 0) return '<span style="color:var(--ink-faint)">—</span>';
    var row = (card.rows || []).filter(function (r) { return r.name === name; })[0];
    if (!row) return '<span style="color:var(--ink-faint)">—</span>';
    var original = Number(row.prices[colIdx]) || 0;
    var rebate = resolveRateRebateEffective(card, name, colIdx, checkInVal, row.prices);
    if (rebate.rateVal !== null && rebate.rateVal !== original) {
      return '<span class="calc-rc-strike">' + formatMoney(original, currency) + '</span> ' + formatMoney(rebate.rateVal, currency);
    }
    return formatMoney(original, currency);
  }

  function renderAgent() {
    var html = '<div class="shell">' + renderTopbar();

    if (state.loading) { html += '</div>'; return html; }

    var cooldownActive = state.nextSyncAllowedAt && Date.now() < state.nextSyncAllowedAt;
    if (!state.rooms.length) {
      html += '<div class="table-wrap"><div class="empty-state"><h2>No data yet</h2>';
      html += '<p>Run a sync from Setup &gt; Property Information to pull live room occupancy from YSuite.</p></div></div></div>';
      return html;
    }

    var rateList = (state.rates && state.rates.list) || [];
    var property = (state.rates && state.rates.property) || {};
    var checkInOptions = allCheckInOptions(rateList);
    // Default to the earliest available date on first load, rather than
    // leaving both blank and making someone pick before seeing anything.
    if (!state.dateRange.start && checkInOptions && checkInOptions.length) state.dateRange.start = checkInOptions[0];
    // Union across every rate card's own Check-out rules (not scoped to
    // whichever one card the selected Start date happens to resolve to -
    // this is a plain property-wide date filter, not a specific room's
    // price calculation), filtered to strictly after Start date once one
    // is set.
    var checkOutOptions = allCheckOutOptions(rateList, state.dateRange.start);
    if (!state.dateRange.end && checkOutOptions && checkOutOptions.length) state.dateRange.end = checkOutOptions[0];
    var resolvedCard = state.dateRange.start ? findRateCardForCheckIn(rateList, state.dateRange.start) : null;

    var effStart = state.dateRange.start, effEnd = state.dateRange.end;
    if (effStart && effEnd && effStart > effEnd) { var tmp = effStart; effStart = effEnd; effEnd = tmp; }
    var avail = computeAvailability(state.rooms, effStart, effEnd, floorConfig());

    // Hot Room overrides (see Setup > Rate Cards > Room Types) apply here
    // too, not just the per-row Available column - the top "Available
    // rooms" figure needs to match what's actually shown below it, not
    // the pre-override real count. Sourced from whichever card the
    // selected Start date resolves to (same card the rate column already
    // uses), since Hot Room is per rate card now, not property-wide.
    var hotRooms = (resolvedCard && resolvedCard.hotRooms) || {};
    var displayedTotal = 0;
    DISPLAY_TYPES.forEach(function (name) {
      var hot = hotRooms[name] || { enabled: false, quantity: null };
      displayedTotal += hot.quantity != null ? hot.quantity : avail.byType[name];
    });

    // The rate column follows the exact same resolve-by-date logic as the
    // Rates/Calculator page's own Rate Card Summary: the selected Start/
    // End dates decide the total nights, which decides which of the
    // card's 3 lease terms actually applies - not just "the lowest of the
    // 3 prices" like before. Column header names the resolved card and
    // term together so it's clear exactly which one is being shown.
    var totalNights = (effStart && effEnd) ? daysBetweenISO(effStart, effEnd) : null;
    var agentColIdx = (resolvedCard && totalNights != null) ? matchedColIdx(resolvedCard, totalNights) : -1;
    var rateColLabel;
    if (resolvedCard && agentColIdx !== -1) {
      rateColLabel = resolvedCard.name + " (" + resolvedCard.columns[agentColIdx].label + ")";
    } else if (resolvedCard) {
      rateColLabel = resolvedCard.name; // resolved a card, but these dates don't match any of its terms
    } else {
      rateColLabel = property.rateType === "Weekly" ? "Weekly Rate" : "Monthly Rate";
    }

    html += '<div class="filter-bar"><div class="filter-fields">';
    html += '<div class="filter-field"><label for="f-start">Start date</label>';
    if (checkInOptions) {
      html += '<select id="f-start"><option value="">Select…</option>';
      checkInOptions.forEach(function (d) { html += '<option value="' + d + '"' + (state.dateRange.start === d ? " selected" : "") + '>' + formatDateDMY(d) + '</option>'; });
      html += '</select>';
    } else {
      html += '<input type="date" id="f-start" value="' + escapeAttr(state.dateRange.start) + '">';
    }
    html += '</div>';
    // End date is always a dropdown, never a free date picker - the
    // property's own Check-out rules define which dates are actually
    // valid, so there's nothing a native date input would add here.
    html += '<div class="filter-field"><label for="f-end">End date</label>';
    html += '<select id="f-end"><option value="">Select…</option>';
    (checkOutOptions || []).forEach(function (d) { html += '<option value="' + d + '"' + (state.dateRange.end === d ? " selected" : "") + '>' + formatDateDMY(d) + '</option>'; });
    html += '</select>';
    html += '</div>';
    html += '</div><div class="filter-actions"><button type="button" class="btn-primary" id="book-tour-btn">Book a Room Tour</button><div class="filter-stat"><div class="label">Available rooms</div><div class="num">' + displayedTotal + '</div></div></div></div>';
    if (state.dateRangeError) html += '<div class="test-result show info" style="margin-bottom:16px">' + escapeHtml(state.dateRangeError) + '</div>';

    html += '<div class="agent-grid"><div class="table-wrap"><table><thead><tr><th>Room type</th><th class="num-col">' + escapeHtml(rateColLabel) + '</th><th class="num-col">Available</th></tr></thead><tbody>';
    DISPLAY_TYPES.forEach(function (name) {
      var hot = hotRooms[name] || { enabled: false, quantity: null };
      // Hot Room's number always overrides the real computed count,
      // independent of the toggle - the toggle only controls the 🔥 icon.
      // (displayedTotal was already accumulated above, before this table -
      // not re-summed here, so the two never have a chance to disagree.)
      var n = hot.quantity != null ? hot.quantity : avail.byType[name];
      var pill = availabilityPill(n);
      html += '<tr><td><div class="rtype-name">' + escapeHtml(name) + (hot.enabled ? " 🔥" : "") + '</div>';
      if (avail.sharedTypes[name]) {
        var g = avail.genderByType[name];
        var parts = ['<span class="g-male">Male ' + g.male + '</span>', '<span class="g-female">Female ' + g.female + '</span>'];
        if (g.fullUnit > 0) parts.push('<span class="g-full">Full Unit ' + g.fullUnit + '</span>');
        // Two different things, deliberately worded so they can't be
        // confused with each other: "unit gender conflict" is about two
        // bedrooms in the SAME shared apartment currently showing
        // different genders from each other (a real occupancy question,
        // e.g. a male and female guest both booked into one unit) -
        // nothing to do with any one room's own data. "Title/Gender
        // mismatch" is the opposite: one room's own Title and Gender
        // fields disagreeing with each other - the same thing the "N
        // Mismatch" button in the topbar counts, unrelated to which unit
        // it's in or who else shares it.
        if (g.titleMismatch > 0) parts.push('<span class="g-conflict" title="' + g.titleMismatch + ' room(s) where Title and Gender disagree with each other on that room\'s own record - same check as the &quot;Mismatch&quot; button above.">⚠ ' + g.titleMismatch + ' Title/Gender mismatch</span>');
        html += '<div class="gender-split">Shared unit · ' + parts.join(' · ') + '</div>';
      }
      html += '</td><td class="num-col"><span style="font-family:var(--mono)">' + agentRoomRateHtml(resolvedCard, name, agentColIdx, effStart || todayISO(), property.currency) + '</span></td>';
      html += '<td class="num-col"><div class="qty-cell"><span class="avail-pill ' + pill.cls + '">' + pill.label + '</span><span class="count-pill' + (n === 0 ? " zero" : "") + '" style="color:var(--ink);font-weight:600">' + n + '</span></div></td></tr>';
    });
    html += '</tbody><tfoot><tr><td>All room types</td><td class="num-col"></td><td class="num-col">' + displayedTotal + '</td></tr></tfoot></table></div>';
    // Promotions follow the same date-resolved card as the rate column
    // above it, per Jeremy - not a fixed/Setup-selected card, so this
    // panel changes together with the rate column as the Start date
    // changes, exactly like the Rates/Calculator page's own promotions
    // panel already does for its own Check-in selection.
    html += renderPromotionsPanel(resolvedCard);
    html += '</div>';

    var unmappedKeys = Object.keys(avail.unmapped);
    if (unmappedKeys.length) {
      html += '<div class="unmapped-note">⚠ ' + unmappedKeys.length + ' room type(s) from YSuite don\'t match a configured base type, so they\'re excluded above: ' +
        unmappedKeys.map(function (k) { return escapeHtml(k) + ' (' + avail.unmapped[k] + ')'; }).join(', ') + '</div>';
    }
    var unclassifiedKeys = Object.keys(avail.unclassifiedFloors);
    if (unclassifiedKeys.length) {
      html += '<div class="unmapped-note">⚠ Some rooms are on floors outside your configured High/Low ranges, so they\'re excluded above: ' +
        unclassifiedKeys.map(function (k) { return escapeHtml(k) + ' (' + avail.unclassifiedFloors[k] + ')'; }).join(', ') +
        '. Check the floor ranges in Setup.</div>';
    }

    html += '</div>';
    return html;
  }

  function renderReservation() {
    var html = '<div class="shell">' + renderTopbar();
    if (state.loading) { html += '</div>'; return html; }

    var cooldownActive = state.nextSyncAllowedAt && Date.now() < state.nextSyncAllowedAt;
    if (!state.rooms.length) {
      html += '<div class="table-wrap"><div class="empty-state"><h2>No data yet</h2>';
      html += '<p>Run a sync from Setup &gt; Property Information to pull live room occupancy from YSuite.</p></div></div></div>';
      return html;
    }

    var rf = state.reservation;
    var stats = reservationStats(state.rooms);
    var allRows = withDisplayType(state.rooms, floorConfig());
    var typeOptions = allDisplayTypeOptions(allRows);
    var rows = filterAndSortRows(allRows, rf);

    // Which stat card (if any) reflects the currently-applied filters, so
    // clicking a card is visually a toggle: click "Available now" to filter
    // to it, click it again (or "Total rooms") to clear back to everything.
    var noOtherFilters = !rf.search && !rf.typeFilter && !rf.dateStart && !rf.dateEnd;
    var activeMetric = null;
    if (noOtherFilters && !rf.statusFilter && !rf.quickFilter) activeMetric = "total";
    else if (noOtherFilters && rf.statusFilter === "available" && !rf.quickFilter) activeMetric = "availableNow";
    else if (noOtherFilters && !rf.statusFilter && rf.quickFilter === "occupied") activeMetric = "occupancyRate";
    else if (noOtherFilters && !rf.statusFilter && rf.quickFilter === "arrivingToday") activeMetric = "arrivingToday";
    else if (noOtherFilters && !rf.statusFilter && rf.quickFilter === "departingToday") activeMetric = "departingToday";

    function statCard(metric, label, value) {
      return '<button type="button" class="stat-card' + (activeMetric === metric ? " active" : "") + '" data-metric="' + metric + '">' +
        '<div class="stat-label">' + label + '</div><div class="stat-num">' + value + '</div></button>';
    }
    html += '<div class="stat-cards">';
    html += statCard("total", "Total rooms", stats.total);
    html += statCard("availableNow", "Available now", stats.availableNow);
    html += statCard("occupancyRate", "Occupancy rate", stats.occupancyRate + "%");
    html += statCard("arrivingToday", "Arriving Today / +7 Days", stats.arrivingToday + " / " + stats.arrivingWithin7);
    html += statCard("departingToday", "Departing today / +7 Days", stats.departingToday + " / " + stats.departingWithin7);
    html += '</div>';

    html += '<div class="res-filter-bar">';
    html += '<input type="text" id="rf-search" class="res-search" placeholder="Search apartment, room type…" value="' + escapeAttr(rf.search) + '">';
    html += '<select id="rf-type" class="res-select"><option value="">All room types</option>';
    typeOptions.forEach(function (t) { html += '<option value="' + escapeAttr(t) + '"' + (rf.typeFilter === t ? " selected" : "") + '>' + escapeHtml(t) + '</option>'; });
    html += '</select>';
    html += '<select id="rf-status" class="res-select"><option value="">All status</option>';
    ["confirmed", "arrived", "unconfirmed", "available", "unavailable"].forEach(function (s) {
      html += '<option value="' + s + '"' + (rf.statusFilter === s ? " selected" : "") + '>' + statusLabel(s) + '</option>';
    });
    html += '</select>';
    html += '<input type="date" id="rf-start" class="res-date" value="' + escapeAttr(rf.dateStart) + '">';
    html += '<input type="date" id="rf-end" class="res-date" value="' + escapeAttr(rf.dateEnd) + '">';
    html += '<button class="icon-btn" id="rf-reset" title="Reset filters">↺</button>';
    html += '</div>';
    if (rf.dateStart && rf.dateEnd) {
      html += '<div class="unmapped-note" style="color:var(--ink-faint);margin:-10px 0 16px">Showing rooms available between ' + escapeHtml(rf.dateStart) + ' and ' + escapeHtml(rf.dateEnd) + '.</div>';
    }

    html += '<div class="table-wrap"><table class="res-table"><thead><tr>';
    html += '<th class="expand-col"></th>';
    html += '<th class="sortable" data-sort="name">Apartment' + sortArrow("name") + '</th>';
    html += '<th class="sortable" data-sort="roomType">Room Type' + sortArrow("roomType") + '</th>';
    html += '<th class="sortable" data-sort="status">Status' + sortArrow("status") + '</th>';
    html += '<th class="sortable" data-sort="availableUntil">Available Until' + sortArrow("availableUntil") + '</th>';

    return Object.keys(state.floorplan.hotspots).map(Number).filter(function (n) { return !isNaN(n); }).sort(function (a, b) { return a - b; });
  }

  function currentFloorHotspots() {
    var floor = state.floorplan.currentFloor;

  // Same filter logic as the Reservation view's filters, applied here so
  // the room list and the highlighted hotspots agree with each other.
  function applyFpFilters(rooms) {
    var f = state.floorplan.filters;
    return rooms.filter(function (r) {
      if (f.roomType && r.roomType !== f.roomType) return false;
      if (f.status && r.status !== f.status) return false;
      if (f.dateStart && f.dateEnd && !isRoomAvailableForRange(r, f.dateStart, f.dateEnd)) return false;
      return true;
    });

  // "Lift" is a built-in default that (per the main dashboard's own
  // convention this data was imported from) is never explicitly saved to
  // the facilities list unless an admin has actually renamed or deleted
  // it - so its absence from stored data is expected, not a gap. Merged
  // in here once so both the viewer and the Setup editor see it
  // consistently, rather than each needing its own special case.
  function activeFacilitiesWithDefaults() {
    var stored = state.floorplan.facilities.filter(function (f) { return !f.deleted; });
    var hasLift = state.floorplan.facilities.some(function (f) { return f.id === "lift"; });
    return hasLift ? stored : [{ id: "lift", name: "Lift", scope: "global" }].concat(stored);
  }

  function facilityDisplayName(facilityKey) {
    // Strip a "__2" style de-dupe suffix (same facility type placed more
    // than once on one floor) before looking up its display name.
    var id = facilityKey.replace(/^facility:/, "").replace(/__\d+$/, "");
    var match = activeFacilitiesWithDefaults().filter(function (f) { return f.id === id; })[0];
    return match ? match.name : id;
  }

  function renderFpHotspotSvg(hotspots, highlightedNames) {
    var highlighting = highlightedNames.length > 0;
    var svg = '<svg class="fp-hotspot-svg" viewBox="0 0 100 100" preserveAspectRatio="none">';
    // Dimming is a native SVG mask, defined and used entirely within this
    // one SVG - not a separate absolutely-positioned <div> styled with
    // CSS mask-image/-webkit-mask-image (the earlier approach). CSS
    // masking on an arbitrary HTML element is inconsistently supported -
    // in practice it can silently render as either "no dimming at all" or
    // "the whole image dimmed with no cutout", exactly the reported
    // symptom (the selected room staying dimmed right along with
    // everything else). An SVG <mask> applied to a plain <rect>, fully
    // inside the SVG document that's already drawing the hotspot outlines,
    // is universally well supported and behaves identically everywhere.
    if (highlighting) {
      svg += '<defs><mask id="fp-dim-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">';
      svg += '<rect x="0" y="0" width="100" height="100" fill="white"/>';
      highlightedNames.forEach(function (name) {
        var points = (hotspots[name] && hotspots[name].points) || [];
        if (points.length < 3) return;
        var pointsAttr = points.map(function (p) { return p.x + "," + p.y; }).join(" ");
        svg += '<polygon points="' + pointsAttr + '" fill="black"/>';
      });
      svg += '</mask></defs>';
      svg += '<rect x="0" y="0" width="100" height="100" fill="rgba(0,0,0,0.62)" mask="url(#fp-dim-mask)"></rect>';
    }
    for (var key in hotspots) {
      var points = hotspots[key].points || [];
      if (points.length < 3) continue;
      var isFacility = key.indexOf("facility:") === 0;
      // While something's selected or a filter is narrowing the room
      // list, every OTHER room's mapping is hidden entirely, not just
      // dimmed - only the highlighted room(s) show at all. Facilities
      // (lifts, stairs) are left visible regardless, since they're
      // orientation landmarks rather than part of what's being
      // filtered/selected.
      if (highlighting && !isFacility && highlightedNames.indexOf(key) === -1) continue;
      var pointsAttr2 = points.map(function (p) { return p.x + "," + p.y; }).join(" ");
      var cls = "fp-hotspot-poly" + (isFacility ? " facility" : "") + (!isFacility && highlightedNames.indexOf(key) !== -1 ? " spotlight" : "");
      var title = isFacility ? facilityDisplayName(key) : key;
      svg += '<polygon class="' + cls + '" points="' + pointsAttr2 + '" data-room="' + escapeAttr(isFacility ? "" : key) + '" vector-effect="non-scaling-stroke"><title>' + escapeHtml(title) + '</title></polygon>';
    }
    svg += '</svg>';
    return svg;
  }

  // Which room names should be "cut out" of the dim mask: a single
  // clicked room takes priority; otherwise, if a filter is actively
  // narrowing the room list, every currently-matching room on this floor
  // that actually has a mapped hotspot. No spotlight and no active filter
  // means nothing highlighted at all (and so no mask/dimming) - matches
  // how the room list itself looks with nothing filtered.
  function fpHighlightedNames(hotspots, spotlightRoom, filteredRooms, filters) {
    if (spotlightRoom) return [spotlightRoom];
    var filtersActive = !!(filters.roomType || filters.status || (filters.dateStart && filters.dateEnd));
    if (!filtersActive) return [];
    var names = [];
    filteredRooms.forEach(function (r) { if (r.name && hotspots[r.name]) names.push(r.name); });
    return names;
  }

    html += renderFpHotspotSvg(hotspots, highlightedNames);
